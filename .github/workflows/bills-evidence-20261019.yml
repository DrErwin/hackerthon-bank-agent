name: Bills L02 and M2 independent acceptance checks
on:
  push:
    branches:
      - ci/bills-evidence-20261019
permissions:
  contents: read
jobs:
  branch-regression:
    name: ${{ matrix.ticket }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - ticket: L02-anomaly-after-L03
            sha: 7d9682a356ee22abc5699fe1bc4c2a994edfdc94
          - ticket: M2-replay-after-L03
            sha: 6bbd9219580f81db4613ab5c1c06a2cc7d405f65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source SHA and install pinned backend
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
          python -m pip install -e './backend[dev]'
      - name: Bills module regression
        run: cd backend && python -m pytest -q app/modules/bills/
      - name: Full backend and MockBank regression
        run: |
          cd backend
          python -m pytest -q
          python -m pytest -q ../evals/mockbank/test_mockbank_eval.py
      - name: Run identification
        run: |
          echo "Ticket=${{ matrix.ticket }}"
          echo "Tested commit=${{ matrix.sha }}"
          git status --porcelain
