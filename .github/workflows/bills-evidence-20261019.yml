name: Bills L03 in-process HTTP report and export evidence
on:
  push:
    branches:
      - ci/bills-evidence-20261019
permissions:
  contents: read
jobs:
  http-report-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'cf5e23ce90e73586b4119d9cf7c43b0e39d35655'
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend
        run: python -m pip install -e './backend[dev]'
      - name: Verify checkout source and HTTP tests
        run: |
          test "$(git rev-parse HEAD)" = "cf5e23ce90e73586b4119d9cf7c43b0e39d35655"
          python -m pytest -q evals/bills/test_report_http_eval.py
      - name: Execute complete-source HTTP report runner
        run: python evals/bills/run_http_evidence.py --revision cf5e23ce90e73586b4119d9cf7c43b0e39d35655
      - name: Emit immutable HTTP report as numbered binary data
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json
          files=list(Path("evals/bills/evidence").glob("**/*-http-l03-exports-cf5e23ce90e7.json.gz"))
          assert len(files)==1,files
          p=files[0]
          blob=p.read_bytes()
          raw=gzip.decompress(blob)
          z=json.loads(raw)
          assert z["tested_revision"]=="cf5e23ce90e73586b4119d9cf7c43b0e39d35655"
          assert z["phase_result"]=="Passed"
          assert z["overall_status"]=="partial"
          assert z["summary"]=={"passed":7,"failed":0,"skipped":0,"error":0,"collection_errors":0}
          assert z["source_verification"]=="git_object_verified_full_backend_and_eval_sources"
          meta={"tested_revision":z["tested_revision"],"path":str(p),
                "summary":z["summary"],"http_request_count":z["http_request_count"],
                "source_files":len(z["source_files"]),
                "backend_tree":z["backend_tree"],
                "gzip_sha256":hashlib.sha256(blob).hexdigest(),
                "decompressed_sha256":hashlib.sha256(raw).hexdigest(),
                "started_at":z["started_at"],"finished_at":z["finished_at"]}
          print("HTTP_EVIDENCE_META="+json.dumps(meta,ensure_ascii=True,separators=(",",":")))
          b64=base64.b64encode(blob).decode()
          for i in range(0,len(b64),1200):
              print(f"HTTP_EVIDENCE_CHUNK_{i//1200:04d}="+b64[i:i+1200])
          print("HTTP_EVIDENCE_TOTAL_CHUNKS="+str((len(b64)+1199)//1200))
          PY
      - name: Archive original HTTP report
        uses: actions/upload-artifact@v4
        with:
          name: bills-http-cf5e23ce90e7
          path: evals/bills/evidence/**/*-http-l03-exports-cf5e23ce90e7.json.gz
          if-no-files-found: error
          retention-days: 7
