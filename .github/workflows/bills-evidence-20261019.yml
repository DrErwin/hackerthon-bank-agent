name: Bills three-ticket independent pre-review regression
on:
  push:
    branches:
      - ci/bills-evidence-20261019
permissions:
  contents: read
jobs:
  bill-ticket-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - ticket: L02-anomalies
            source_sha: 530b887550080d31c766f21a9c7aa601b1db21ef
    name: ${{ matrix.ticket }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend + pytest
        run: python -m pip install -e './backend[dev]'
      - name: Scoped bills module tests
        run: |
          cd backend
          python -m pytest -q app/modules/bills/
      - name: Full backend and MockBank regression
        run: |
          cd backend
          python -m pytest -q
          python -m pytest -q ../evals/mockbank/test_mockbank_eval.py
      - name: Pin revision and nonproduction test boundary
        run: |
          echo TESTED_TICKET=${{ matrix.ticket }}
          echo EXPECTED_TESTED_SHA=${{ matrix.source_sha }}
          git rev-parse HEAD
          git status --porcelain
          echo Tests run only against MockBank fixtures and fixed test planners.
