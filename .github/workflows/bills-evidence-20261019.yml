name: Bills evidence isolated 2026-10-19
on:
  push:
    branches:
      - ci/bills-evidence-20261019
permissions:
  contents: read
jobs:
  test-and-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project tests
        run: python -m pip install -e './backend[dev]'
      - name: Full source checkout and fresh pinned run
        run: |
          python evals/bills/run_evidence.py --revision 999c1c062cc946f89bae6607eafe6234f4f76a40
      - name: Emit auditable compressed report as numbered log chunks
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, gzip, json
          files = list(Path('evals/bills/evidence').glob('**/*-private-arithmetic-999c1c062cc9.json.gz'))
          assert len(files)==1, f'expected 1 fresh report, got {len(files)}'
          p=files[0]
          blob=p.read_bytes()
          raw=gzip.decompress(blob)
          obj=json.loads(raw)
          assert obj['tested_revision']=='999c1c062cc946f89bae6607eafe6234f4f76a40'
          assert obj['source_verification']=='git_object_verified_source_files'
          assert obj['summary']=={'passed':147,'failed':0,'skipped':0,'error':0,'collection_errors':0}
          assert obj['tier_counts']=={'private_arithmetic':130,'evidence_tooling':17}, obj['tier_counts']
          meta={'filename':p.name,'relative_path':str(p),'tested_revision':obj['tested_revision'],'compressed_sha256':hashlib.sha256(blob).hexdigest(),'uncompressed_sha256':hashlib.sha256(raw).hexdigest(),'summary':obj['summary'],'tier_counts':obj['tier_counts'],'source_verification':obj['source_verification'],'source_file_count':len(obj['source_files'])}
          print('EVIDENCE_META='+json.dumps(meta,ensure_ascii=True,separators=(',',':')))
          b64=base64.b64encode(blob).decode('ascii')
          for i in range(0,len(b64),1200):
              print(f'EVIDENCE_CHUNK_{i//1200:04d}='+b64[i:i+1200])
          print('EVIDENCE_TOTAL_CHUNKS='+str((len(b64)+1199)//1200))
          PY
      - name: Archive raw evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: bills-fresh-run-999c1c062cc9
          path: evals/bills/evidence/**/*-private-arithmetic-999c1c062cc9.json.gz
          if-no-files-found: error
          retention-days: 7
