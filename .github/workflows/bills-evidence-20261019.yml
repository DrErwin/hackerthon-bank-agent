name: Bills L01 public business stage acceptance
on:
  push:
    branches:
      - ci/bills-evidence-20261019
permissions:
  contents: read
jobs:
  public-business-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ef3f720e9e14aba1f97900a3063b8b4374ae760e'
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend
        run: python -m pip install -e './backend[dev]'
      - name: L01 independent business and arithmetic test suite
        run: |
          test "$(git rev-parse HEAD)" = "ef3f720e9e14aba1f97900a3063b8b4374ae760e"
          python -m pytest -q evals/bills/
      - name: Run full-source public L01 business runner
        run: python evals/bills/run_business_evidence.py --revision ef3f720e9e14aba1f97900a3063b8b4374ae760e
      - name: Emit immutable raw report metadata and numbered ZIP bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json
          matches=list(Path("evals/bills/evidence").glob("**/*-public-l01-phase1-ef3f720e9e14.json.gz"))
          assert len(matches)==1,matches
          file=matches[0]
          compressed=file.read_bytes()
          data=json.loads(gzip.decompress(compressed))
          assert data["tested_revision"]=="ef3f720e9e14aba1f97900a3063b8b4374ae760e"
          assert data["phase_result"]=="Passed"
          assert data["overall_status"]=="partial"
          assert data["summary"]=={"passed":17,"failed":0,"skipped":0,"error":0,"collection_errors":0}
          assert data["source_verification"]=="git_object_verified_complete_business_sources"
          meta={"report":str(file),"revision":data["tested_revision"],
                "tested_tree":data["tested_tree"],"summary":data["summary"],
                "blocked_path_count":data["blocked_path_count"],
                "source_files":len(data["source_files"]),
                "compressed_sha256":hashlib.sha256(compressed).hexdigest(),
                "decompressed_sha256":hashlib.sha256(gzip.decompress(compressed)).hexdigest(),
                "started_at":data["started_at"],"finished_at":data["finished_at"]}
          print("BUSINESS_EVIDENCE_META="+json.dumps(meta,ensure_ascii=True,separators=(",",":")))
          b64=base64.b64encode(compressed).decode()
          for i in range(0,len(b64),1200):
              print(f"BUSINESS_EVIDENCE_CHUNK_{i//1200:04d}="+b64[i:i+1200])
          print("BUSINESS_EVIDENCE_TOTAL_CHUNKS="+str((len(b64)+1199)//1200))
          PY
      - name: Archive original business report
        uses: actions/upload-artifact@v4
        with:
          name: bills-l01-business-ef3f720e9e14
          path: evals/bills/evidence/**/*-public-l01-phase1-ef3f720e9e14.json.gz
          if-no-files-found: error
          retention-days: 7
