name: Bills 07 real L03 HTTP report-export evidence
on:
  push:
    branches:
      - ci/bills-07-evidence-20261020
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project backend test deps
        run: python -m pip install -e './backend[dev]'
      - name: Run seven real in-process HTTP chains
        run: python evals/bills/run_http_evidence.py --revision e1111830cece552da8009ca474c9a7db3058571d
      - name: Inspect and serialize original gzip evidence
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          items=list(Path('evals/bills/evidence').glob('**/*-http-l03-exports-e1111830cece.json.gz'))
          assert len(items)==1,len(items)
          p=items[0]; compressed=p.read_bytes(); raw=gzip.decompress(compressed)
          report=json.loads(raw)
          assert report['tested_revision']=='e1111830cece552da8009ca474c9a7db3058571d'
          assert report['source_verification']=='git_object_verified_full_backend_and_eval_sources'
          assert report['summary']=={'passed':7,'failed':0,'skipped':0,'error':0,'collection_errors':0},report['summary']
          assert report['phase_result']=='Passed' and report['full_ticket_acceptance'] is False
          assert report['runtime_sources_verified'] and report['http_request_count'] >= 7
          meta={'filename':p.name,'source':report['tested_revision'],'tree':report['tested_tree'],'backend_tree':report['backend_tree'],'summary':report['summary'],'requests':report['http_request_count'],'source_files':len(report['source_files']),'imports':len(report['runtime_imports']),'gzip_sha256':hashlib.sha256(compressed).hexdigest(),'json_sha256':hashlib.sha256(raw).hexdigest()}
          print('HTTP07_META='+json.dumps(meta,separators=(',',':')))
          b64=base64.b64encode(compressed).decode()
          for i in range(0,len(b64),1200):print(f'HTTP07_CHUNK_{i//1200:04d}='+b64[i:i+1200])
          print('HTTP07_TOTAL_CHUNKS='+str((len(b64)+1199)//1200))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bills-07-http-e1111830cece
          path: evals/bills/evidence/**/*-http-l03-exports-e1111830cece.json.gz
          if-no-files-found: error
          retention-days: 7
