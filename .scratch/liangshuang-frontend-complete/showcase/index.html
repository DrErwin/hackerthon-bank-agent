<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 银行助手 · v0.4 前端 E2E 旅程画板</title>
<style>
  :root {
    --ink: #243642;
    --ink-soft: #55646c;
    --paper: #f4eee1;
    --card: #fffdf7;
    --line: #d8d0be;
    --real: #2f6b4f;
    --eval: #39698c;
    --comp: #7a6a55;
    --amber: #a8752a;
    --red: #a8443a;
    --violet: #6b5b95;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }

  /* ---------- top bar ---------- */
  .topbar {
    position: fixed; inset: 0 0 auto 0; height: 64px;
    display: flex; align-items: center; gap: 16px; padding: 0 16px;
    background: rgba(250, 246, 238, .94);
    backdrop-filter: blur(8px);
    border-bottom: 2px solid #ded5c4;
    z-index: 60;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 260px; }
  .mark {
    width: 38px; height: 38px; flex: none; border-radius: 11px;
    background: #1f6f5c; color: #fff; display: grid; place-items: center;
    font-weight: 800; font-size: 18px; transform: rotate(-4deg);
    box-shadow: 2px 2px 0 rgba(0, 0, 0, .16);
  }
  .brand h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  .brand p { margin: 2px 0 0; font-size: 11.5px; color: #6d7a80; }
  .lens { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: nowrap; }
  .lens button {
    border: 1.5px solid #c9c1b0; background: #fffdf8; color: #3a4a52;
    border-radius: 999px; padding: 7px 13px; font-size: 12.5px; cursor: pointer; font-weight: 600;
    white-space: nowrap;
  }
  .lens button:hover { background: #f3ead9; }
  .lens button.on { background: #243642; color: #fffdf3; border-color: #243642; }
  .tools { display: flex; align-items: center; gap: 10px; }
  .zoom {
    display: flex; align-items: center; gap: 1px;
    border: 1.5px solid #c9c1b0; border-radius: 999px; background: #fffdf8; padding: 2px;
  }
  .zoom button { width: 28px; height: 28px; border: 0; background: transparent; font-size: 15px; cursor: pointer; border-radius: 999px; }
  .zoom button:hover { background: #eee5d6; }
  .zoom span { min-width: 46px; text-align: center; font-size: 12px; color: #5b6a72; font-variant-numeric: tabular-nums; }
  .help { font-size: 11px; color: #7c8589; max-width: 172px; line-height: 1.35; }

  /* ---------- board ---------- */
  #stage {
    position: fixed; top: 64px; left: 0; right: 0; bottom: 0; overflow: hidden; cursor: grab;
    background:
      radial-gradient(circle at 1px 1px, rgba(60, 80, 90, .15) 1px, transparent 1.4px) 0 0 / 26px 26px,
      linear-gradient(180deg, #f7f2e7, #efe8d9);
  }
  #stage.dragging { cursor: grabbing; }
  #world {
    position: absolute; top: 0; left: 0; width: 2380px; height: 4500px;
    transform-origin: 0 0;
    transition: transform .38s cubic-bezier(.2, .7, .2, 1);
    will-change: transform;
  }
  #stage.dragging #world { transition: none; }

  .lane {
    position: absolute; left: 20px;
    border-radius: 24px; border: 2px dashed var(--lane-line); background: var(--lane-bg);
  }
  .annotation {
    position: absolute; max-width: 380px; font-size: 13px; line-height: 1.6;
    color: #6a5b45; transform: rotate(-1.6deg); font-weight: 600; pointer-events: none;
  }
  .annotation::before { content: "✎ "; color: #b07d2b; }
  .annotation::after {
    content: ""; display: block; height: 3px; width: 70px; margin-top: 7px; border-radius: 2px;
    background: repeating-linear-gradient(90deg, #b07d2b 0 8px, transparent 8px 13px);
  }
  .lane[data-lane="transfer"] { --lane-bg: #edf5f4; --lane-line: #9dbfb6; --lane-ink: #23645a; }
  .lane[data-lane="bills"]    { --lane-bg: #f2f6ea; --lane-line: #a9c08d; --lane-ink: #4c6b32; }
  .lane[data-lane="cross"]    { --lane-bg: #f8f1e3; --lane-line: #cdab72; --lane-ink: #875f1e; }
  .lane[data-lane="mobile"]   { --lane-bg: #f3eff8; --lane-line: #b3a1cd; --lane-ink: #5d4d86; }
  .lane-head { position: absolute; left: 22px; top: 12px; right: 22px; display: flex; align-items: baseline; gap: 12px; }
  .lane-head h2 { margin: 0; font-size: 23px; letter-spacing: .5px; color: var(--lane-ink); }
  .lane-head p { margin: 0; font-size: 12.5px; color: #68757a; }
  .lane-head .badge {
    margin-left: auto; font-size: 11px; font-weight: 800; letter-spacing: .4px;
    color: var(--lane-ink); border: 1.5px solid var(--lane-line); border-radius: 999px; padding: 2px 10px;
    background: rgba(255, 255, 255, .55);
  }
  .rowlabel {
    position: absolute; font-size: 12.5px; font-weight: 700; letter-spacing: .3px;
    color: #5a6a70; background: #fffdf6; border: 1px solid #d8d0be; border-radius: 8px;
    padding: 3px 10px; box-shadow: 1px 1px 0 rgba(0, 0, 0, .05); white-space: nowrap;
  }

  /* ---------- nodes ---------- */
  .node {
    position: absolute; width: 300px; height: 324px;
    background: var(--card); border: 2px solid #2a3a42; border-radius: 16px;
    padding: 12px 14px; text-align: left; cursor: pointer; color: inherit;
    box-shadow: 5px 6px 0 rgba(42, 58, 66, .13);
    transition: transform .15s, box-shadow .15s;
    display: flex; flex-direction: column;
  }
  .node:hover { transform: translateY(-3px); box-shadow: 6px 9px 0 rgba(42, 58, 66, .18); }
  .node.active { outline: 3px solid #e08a2e; outline-offset: 3px; }
  .kick { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: #71808a; font-weight: 700; letter-spacing: .3px; }
  .step {
    display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
    background: #243642; color: #fff; font-size: 11px; font-weight: 800; flex: none;
  }
  .node h3 { margin: 6px 0 8px; font-size: 15.5px; line-height: 1.25; letter-spacing: .2px; min-height: 39px; }
  .shot {
    height: 150px; border-radius: 10px; border: 1px solid #d9d1bf;
    background-size: cover; background-position: top center; background-color: #eef1f2;
    flex: none;
  }
  .shot.bottom { background-position: bottom center; }
  .shot.zoom { background-size: 185%; background-position: 50% 94%; }
  .desc {
    margin: 8px 0 0; font-size: 11.6px; line-height: 1.45; color: #55646c;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 50px;
  }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; gap: 6px; }
  .tag { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .tag.real { background: #e4f2e9; border-color: #9dc7ad; color: #1f5c40; }
  .tag.eval { background: #e6eff6; border-color: #a6c3d8; color: #24506f; }
  .tag.comp { background: #efeae0; border-color: #c8b99f; color: #6b5636; }
  .tag.mobile { background: #efe9f6; border-color: #bcaed6; color: #55417e; }
  .branch { font-size: 10.5px; color: #8a6a2f; font-weight: 800; }

  .node.noimg .quote {
    margin-top: 8px; height: 150px; border: 1.5px dashed #cdb98f; border-radius: 10px;
    background: #fff8e8; padding: 10px 11px; font-size: 12px; line-height: 1.55; color: #6b5324;
    overflow: hidden; flex: none;
  }
  .node.noimg .quote b { display: block; font-size: 12.5px; margin-bottom: 4px; color: #58431a; }

  .node.phone { width: 250px; height: 566px; padding: 10px 10px 12px; }
  .node.phone .shot { height: 430px; background-size: contain; background-repeat: no-repeat; background-position: center top; background-color: #e2e8ec; }
  .node.phone h3 { font-size: 14px; min-height: 20px; }
  .node.phone .desc { min-height: 34px; -webkit-line-clamp: 2; font-size: 11.4px; }
  .node.phone .foot { padding-top: 6px; }

  .shot.double { display: flex; gap: 6px; background: transparent; border: 0; height: 150px; }
  .shot.double div { flex: 1; border: 1px solid #d9d1bf; border-radius: 8px; background-size: cover; background-position: top center; background-color: #eef1f2; }
  .shot.double span { position: absolute; font-size: 10px; }

  /* ---------- edges ---------- */
  #edges { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .edge { fill: none; stroke-width: 2.4; stroke-linecap: round; }
  .edge.main { stroke: #2b3a42; }
  .edge.continue { stroke: #b07d2b; stroke-dasharray: 8 6; }
  .edge.stop { stroke: #b04a3a; stroke-dasharray: 8 6; }
  .edge.side { stroke: #7d8a90; stroke-dasharray: 4 7; }
  .edge.recover { stroke: #39698c; stroke-dasharray: 11 6; }
  .edge-label {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 10.5px; font-weight: 800; letter-spacing: .2px;
    background: #fbf7ee; border: 1.4px solid #b9b09e; border-radius: 999px; padding: 1px 8px;
    color: #4b5a62; white-space: nowrap; box-shadow: 1px 1px 0 rgba(0, 0, 0, .06);
  }
  .edge-label.continue { border-color: #c69a4b; color: #7d5a17; }
  .edge-label.stop { border-color: #c17a6f; color: #8a3a30; }
  .edge-label.side { border-color: #a9b2b6; color: #5f6c72; }
  .edge-label.recover { border-color: #8bb0c9; color: #2c5a7c; }

  /* ---------- lens dimming ---------- */
  body[data-lens="transfer"] .node:not([data-lane="transfer"]),
  body[data-lens="transfer"] .lane:not([data-lane="transfer"]),
  body[data-lens="transfer"] .annotation:not([data-lane="transfer"]),
  body[data-lens="transfer"] .rowlabel:not([data-lane="transfer"]),
  body[data-lens="transfer"] .edge-label:not([data-lane="transfer"]),
  body[data-lens="transfer"] .edgegroup:not([data-lane="transfer"]) { opacity: .1; pointer-events: none; }
  body[data-lens="bills"] .node:not([data-lane="bills"]),
  body[data-lens="bills"] .lane:not([data-lane="bills"]),
  body[data-lens="bills"] .annotation:not([data-lane="bills"]),
  body[data-lens="bills"] .rowlabel:not([data-lane="bills"]),
  body[data-lens="bills"] .edge-label:not([data-lane="bills"]),
  body[data-lens="bills"] .edgegroup:not([data-lane="bills"]) { opacity: .1; pointer-events: none; }
  body[data-lens="cross"] .node:not([data-lane="cross"]),
  body[data-lens="cross"] .lane:not([data-lane="cross"]),
  body[data-lens="cross"] .annotation:not([data-lane="cross"]),
  body[data-lens="cross"] .rowlabel:not([data-lane="cross"]),
  body[data-lens="cross"] .edge-label:not([data-lane="cross"]),
  body[data-lens="cross"] .edgegroup:not([data-lane="cross"]) { opacity: .1; pointer-events: none; }
  body[data-lens="mobile"] .node:not([data-lane="mobile"]),
  body[data-lens="mobile"] .lane:not([data-lane="mobile"]),
  body[data-lens="mobile"] .annotation:not([data-lane="mobile"]),
  body[data-lens="mobile"] .rowlabel:not([data-lane="mobile"]),
  body[data-lens="mobile"] .edge-label:not([data-lane="mobile"]),
  body[data-lens="mobile"] .edgegroup:not([data-lane="mobile"]) { opacity: .1; pointer-events: none; }
  .node, .lane, .annotation, .rowlabel, .edge-label, .edgegroup { transition: opacity .25s; }

  /* ---------- drawer ---------- */
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 94vw);
    background: #fffdf7; border-left: 3px solid #243642;
    box-shadow: -14px 0 40px rgba(30, 40, 45, .18);
    transform: translateX(105%); transition: transform .3s cubic-bezier(.2, .7, .2, 1);
    z-index: 80; display: flex; flex-direction: column;
  }
  body.drawer-open #drawer { transform: none; }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 13px 18px; border-bottom: 1px dashed #d8cfbd; }
  .drawer-head .where { font-size: 12px; color: #70808a; font-weight: 700; }
  .drawer-head button { border: 1.5px solid #c9c1b0; background: #fffdf8; border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
  .drawer-body { overflow: auto; padding: 14px 18px 30px; }
  .drawer-body h2 { font-size: 20px; margin: 12px 0 4px; line-height: 1.3; }
  .drawer-body .sub { font-size: 12px; color: #70808a; margin: 0 0 12px; }
  .drawer-body img { width: 100%; border: 1px solid #d8cfbd; border-radius: 10px; cursor: zoom-in; background: #eef1f2; display: block; }
  .drawer-body .openfull { display: block; margin-top: 4px; font-size: 11.5px; color: #39698c; text-align: right; text-decoration: none; }
  .drawer-body .quote { margin: 6px 0 0; border: 1.5px dashed #cdb98f; border-radius: 10px; background: #fff8e8; padding: 12px 14px; font-size: 13px; line-height: 1.6; color: #6b5324; }
  .drawer-body h4 { font-size: 11.5px; letter-spacing: 1px; color: #9a8459; margin: 18px 0 5px; }
  .drawer-body p { font-size: 13.5px; line-height: 1.65; color: #3c4c55; margin: 0; }
  .drawer-body .src { font-size: 11.5px; color: #7d8a90; border-top: 1px dashed #ddd4c2; padding-top: 10px; margin-top: 18px; line-height: 1.5; }
  .drawer-body .cap { font-size: 11.5px; color: #7d8a90; margin: 4px 0 10px; }

  /* ---------- legend / hint / lightbox ---------- */
  #legend {
    position: fixed; left: 16px; bottom: 16px; z-index: 45;
    background: rgba(255, 253, 247, .95); border: 2px solid #2a3a42; border-radius: 14px;
    box-shadow: 4px 5px 0 rgba(42, 58, 66, .14); padding: 9px 12px; font-size: 11px; color: #4b5a62;
    display: flex; gap: 16px; max-width: calc(100vw - 420px);
  }
  #legend .col { display: flex; flex-direction: column; gap: 3px; }
  #legend .col b { font-size: 10.5px; letter-spacing: .5px; color: #7a6a55; margin-bottom: 1px; }
  .swatch { display: inline-block; width: 20px; height: 0; border-top: 3px solid #2b3a42; vertical-align: middle; margin-right: 6px; }
  .swatch.ds { border-top-style: dashed; }
  .swatch.amber { border-top-color: #b07d2b; }
  .swatch.red { border-top-color: #b04a3a; }
  .swatch.blue { border-top-color: #39698c; }
  #hint {
    position: fixed; right: 16px; bottom: 16px; z-index: 45;
    background: #243642; color: #fdf8ec; border-radius: 999px; padding: 8px 14px;
    font-size: 11.5px; box-shadow: 3px 4px 0 rgba(0, 0, 0, .2); opacity: .94;
  }
  #lightbox {
    position: fixed; inset: 0; background: rgba(22, 32, 38, .88); display: none;
    align-items: center; justify-content: center; z-index: 100; padding: 3vh 3vw; cursor: zoom-out;
  }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 100%; max-height: 94vh; border-radius: 8px; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.4); }

  @media (max-width: 1180px) {
    .help { display: none; }
    .brand { min-width: 0; }
    .brand p { display: none; }
    #legend { max-width: calc(100vw - 32px); flex-wrap: wrap; }
  }
</style>
</head>
<body data-lens="transfer">
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">银</span>
    <div>
      <h1>前端 E2E 旅程画板</h1>
      <p id="statline">v0.4 完整前端 · 真实接口 · 2026-10-21</p>
    </div>
  </div>
  <nav class="lens" aria-label="按业务线聚焦">
    <button data-lens="all">总览</button>
    <button data-lens="transfer" class="on">转账业务线</button>
    <button data-lens="bills">账单业务线</button>
    <button data-lens="cross">安全与恢复</button>
    <button data-lens="mobile">手机适老</button>
  </nav>
  <div class="tools">
    <div class="zoom" role="group" aria-label="缩放">
      <button id="zoom-out" aria-label="缩小">−</button>
      <span id="zoom-pct">60%</span>
      <button id="zoom-in" aria-label="放大">+</button>
      <button id="fit" aria-label="适应窗口" title="适应当前业务线">⤢</button>
    </div>
    <div class="help">拖动空白处平移 · 滚轮上下 · Ctrl+滚轮缩放<br />点卡片看大图与分叉说明</div>
  </div>
</header>

<div id="stage" aria-label="E2E 旅程画板">
  <div id="world">
    <svg id="edges" viewBox="0 0 2380 4500" aria-hidden="true"></svg>
  </div>
</div>

<aside id="drawer" aria-label="步骤详情" aria-hidden="true">
  <div class="drawer-head">
    <span class="where" id="drawer-where"></span>
    <button id="drawer-close" aria-label="关闭详情">关闭 ✕</button>

</aside>

<div id="legend">
  <div class="col">
    <b>连线</b>
    <span><i class="swatch"></i>主线（顺利办完）</span>

  <div class="col">
    <b>卡片标签</b>
    <span><i class="swatch" style="border-color:#2f6b4f"></i>真实接口 E2E</span>
    <span><i class="swatch" style="border-color:#39698c"></i>评测浏览器</span>
    <span><i class="swatch" style="border-color:#a8752a"></i>组件 / 契约测试</span>
    <span><i class="swatch" style="border-color:#6b5b95"></i>手机视口实测</span>
  </div>
</div>
<div id="hint">← 拖动平移 · Ctrl+滚轮缩放 · 点卡片看大图</div>
<div id="lightbox" aria-hidden="true"><img alt="截图大图" /></div>

<script>
/* ======================= 数据 ======================= */

const H = 4500;
const NODE_W = 300;
const NODE_H = 324;
const PHONE_W = 250;
const PHONE_H = 566;

const LANES = [

const NODES = [
  /* ---------------- 转账业务线 ---------------- */
  {

const laneById = Object.fromEntries(LANES.map((l) => [l.id, l]));
const nodeById = Object.fromEntries(NODES.map((n) => [n.id, n]));
const branchCount = {};
for (const e of EDGES) {
  if (["continue", "stop", "side"].includes(e.kind)) branchCount[e.from] = (branchCount[e.from] || 0) + 1;
}
const nodeRects = {};

function esc(text) {
  return String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function nodeRect(n) {
  const lane = laneById[n.lane];
  const row = lane.rows[n.row];
  const w = n.phone ? PHONE_W : NODE_W;
  const h = n.phone ? PHONE_H : NODE_H;
  return { x: LEFT + n.col * COL, y: row.y, w, h };
}

function renderBoard() {
  const world = document.getElementById("world");
  const svg = document.getElementById("edges");

  for (const lane of LANES) {
    const el = document.createElement("div");
    el.className = "lane";
    el.dataset.lane = lane.id;
    el.dataset.zone = "lane";
    el.style.top = lane.top + "px";
    el.style.height = lane.height + "px";
    el.style.width = (lane.width || 2320) + "px";
    el.innerHTML =
      '<div class="lane-head"><h2>' + esc(lane.title) + "</h2><p>" + esc(lane.sub) +
      '</p><span class="badge">' + esc(lane.badge) + "</span></div>";
    world.appendChild(el);

    for (const row of lane.rows) {
      const label = document.createElement("div");
      label.className = "rowlabel";
      label.dataset.lane = lane.id;
      label.dataset.zone = "rowlabel";
      label.style.left = LEFT + "px";
      label.style.top = row.y - 34 + "px";
      label.textContent = row.label;
      world.appendChild(label);
    }
  }

  for (const note of ANNOTATIONS) {
    const el = document.createElement("div");
    el.className = "annotation";
    el.dataset.lane = note.lane;
    el.dataset.zone = "annotation";
    el.style.left = note.x + "px";
    el.style.top = note.y + "px";
    el.textContent = note.text;
    world.appendChild(el);
  }

  for (const n of NODES) {
    const rect = nodeRect(n);
    nodeRects[n.id] = rect;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "node" + (n.phone ? " phone" : "") + (n.noimg ? " noimg" : "");
    button.dataset.id = n.id;
    button.dataset.lane = n.lane;
    button.style.left = rect.x + "px";
    button.style.top = rect.y + "px";
    const tag = '<span class="tag ' + n.tag + '">' + TAG_TEXT[n.tag] + "</span>";
    const branches = branchCount[n.id] ? '<span class="branch">↳ ' + branchCount[n.id] + " 条分叉</span>" : "";
    let media;
    if (n.phone) {
      media = '<div class="shot" style="background-image:url(' + n.img + ')"></div>';
    } else if (n.double) {
      media = '<div class="shot double"><div style="background-image:url(' + n.double[0] + ')"></div><div style="background-image:url(' + n.double[1] + ')"></div></div>';
    } else if (n.noimg) {
      media = '<div class="quote">' + (n.note || esc(n.desc)) + "</div>";
    } else {
      media = '<div class="shot ' + (n.pos === "bottom" ? "bottom" : n.pos === "bottom-zoom" ? "bottom zoom" : "") + '" style="background-image:url(' + n.img + ')"></div>';
    }
    button.innerHTML =
      '<div class="kick"><span class="step">' + esc(n.num) + "</span><span>" + esc(n.sub) + "</span></div>" +
      "<h3>" + esc(n.title) + "</h3>" + media +
      '<p class="desc">' + esc(n.desc) + "</p>" +
      '<div class="foot">' + tag + branches + "</div>";
    button.addEventListener("click", () => {
      if (suppressClick) { suppressClick = false; return; }
      openDrawer(n.id);
    });
    world.appendChild(button);
  }

  // 连线
  const NS = "http://www.w3.org/2000/svg";
  const defs = document.createElementNS(NS, "defs");
  const colors = { main: "#2b3a42", continue: "#b07d2b", stop: "#b04a3a", side: "#7d8a90", recover: "#39698c" };
  for (const [kind, color] of Object.entries(colors)) {
    const marker = document.createElementNS(NS, "marker");
    marker.setAttribute("id", "arrow-" + kind);
    marker.setAttribute("viewBox", "0 0 10 10");
    marker.setAttribute("refX", "8");
    marker.setAttribute("refY", "5");
    marker.setAttribute("markerWidth", "7");
    marker.setAttribute("markerHeight", "7");
    marker.setAttribute("orient", "auto-start-reverse");
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
    path.setAttribute("fill", color);
    marker.appendChild(path);
    defs.appendChild(marker);
  }
  svg.appendChild(defs);

  for (const e of EDGES) {
    const a = nodeRects[e.from];
    const b = nodeRects[e.to];
    if (!a || !b) continue;
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "edgegroup");
    g.dataset.lane = nodeById[e.from].lane;
    let d;
    let labelAt;
    const sameRow = Math.abs(a.y - b.y) < 2;
    if (sameRow) {
      const x1 = a.x + a.w;
      const y1 = a.y + a.h / 2;
      const x2 = b.x - 8;
      const y2 = b.y + b.h / 2;
      d = "M " + x1 + " " + y1 + " C " + (x1 + 70) + " " + y1 + ", " + (x2 - 70) + " " + y2 + ", " + x2 + " " + y2;
      labelAt = { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 16 };
    } else {
      const x1 = a.x + a.w / 2;
      const y1 = a.y + a.h;
      const x2 = b.x + b.w / 2;
      const y2 = b.y - 8;
      d = "M " + x1 + " " + y1 + " C " + x1 + " " + (y1 + 60) + ", " + x2 + " " + (y2 - 60) + ", " + x2 + " " + y2;
      labelAt = { x: (x1 + x2) / 2 + 8, y: (y1 + y2) / 2 };
    }
    const path = document.createElementNS(NS, "path");
    path.setAttribute("class", "edge " + e.kind);
    path.setAttribute("d", d);
    path.setAttribute("marker-end", "url(#arrow-" + e.kind + ")");
    g.appendChild(path);
    svg.appendChild(g);

    if (e.label) {
      const label = document.createElement("div");
      label.className = "edge-label " + e.kind;
      label.dataset.lane = nodeById[e.from].lane;
      label.dataset.zone = "edge-label";
      label.style.left = labelAt.x + "px";
      label.style.top = labelAt.y + "px";
      label.textContent = e.label;
      world.appendChild(label);
    }
  }

  const realCount = NODES.filter((n) => n.tag === "real").length;
  const branchCountTotal = EDGES.filter((e) => ["continue", "stop", "side"].includes(e.kind)).length;
  document.getElementById("statline").textContent =
    "v0.4 完整前端 · " + NODES.length + " 个页面状态 · " + branchCountTotal + " 条分叉 · " + realCount + " 个真实接口证据";
}

const stage = document.getElementById("stage");
const world = document.getElementById("world");
const pct = document.getElementById("zoom-pct");
const drawer = document.getElementById("drawer");
const drawerBody = document.getElementById("drawer-body");
const drawerWhere = document.getElementById("drawer-where");
const lightbox = document.getElementById("lightbox");
const view = { x: 0, y: 0, z: 0.6 };
let suppressClick = false;
let activeId = null;

function applyView() {
  world.style.transform = "translate(" + view.x + "px," + view.y + "px) scale(" + view.z + ")";
  pct.textContent = Math.round(view.z * 100) + "%";
}

function fitRect(rect) {
  const vw = stage.clientWidth;
  const vh = stage.clientHeight;
  const pad = 70;
  let z = Math.min((vw - pad * 2) / rect.w, (vh - pad * 2) / rect.h);
  z = Math.max(0.16, Math.min(1, z));
  view.z = z;
  view.x = (vw - rect.w * z) / 2 - rect.x * z;
  view.y = (vh - rect.h * z) / 2 - rect.y * z;
  applyView();
}

function focusLens(lens) {
  document.body.dataset.lens = lens;
  document.querySelectorAll(".lens button").forEach((b) => b.classList.toggle("on", b.dataset.lens === lens));
  if (lens === "all") {
    fitRect({ x: 0, y: 0, w: W, h: H });
    return;
  }
  const lane = laneById[lens];
  const vw = stage.clientWidth;
  const vh = stage.clientHeight;
  const laneW = lane.width || 2320;
  const z = Math.min((vw - 90) / laneW, 1);
  view.z = z;
  view.x = (vw - laneW * z) / 2 - 20 * z;
  view.y = 26 - lane.top * z;
  applyView();
}

document.querySelectorAll(".lens button").forEach((button) => {
  button.addEventListener("click", () => focusLens(button.dataset.lens));
});
document.getElementById("fit").addEventListener("click", () => {
  const lens = document.body.dataset.lens;
  focusLens(lens === "all" ? "all" : lens);
});
function zoomAt(clientX, clientY, factor) {
  const rect = stage.getBoundingClientRect();
  const px = clientX - rect.left;
  const py = clientY - rect.top;
  const wx = (px - view.x) / view.z;
  const wy = (py - view.y) / view.z;
  const next = Math.max(0.14, Math.min(1.6, view.z * factor));
  view.x = px - wx * next;
  view.y = py - wy * next;
  view.z = next;
  applyView();
}
document.getElementById("zoom-in").addEventListener("click", () => {
  const rect = stage.getBoundingClientRect();
  zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.22);
});
document.getElementById("zoom-out").addEventListener("click", () => {
  const rect = stage.getBoundingClientRect();
  zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1 / 1.22);
});

let drag = null;
stage.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  drag = { x: event.clientX, y: event.clientY, vx: view.x, vy: view.y, moved: false };
  suppressClick = false;
  stage.classList.add("dragging");
  stage.setPointerCapture(event.pointerId);
});
stage.addEventListener("pointermove", (event) => {
  if (!drag) return;
  const dx = event.clientX - drag.x;
  const dy = event.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  view.x = drag.vx + dx;
  view.y = drag.vy + dy;
  applyView();
});
function endDrag(event) {
  if (!drag) return;
  suppressClick = drag.moved;
  drag = null;
  stage.classList.remove("dragging");
  if (event && stage.hasPointerCapture(event.pointerId)) stage.releasePointerCapture(event.pointerId);
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("wheel", (event) => {
  event.preventDefault();
  if (event.ctrlKey || event.metaKey) {
    zoomAt(event.clientX, event.clientY, Math.exp(-event.deltaY * 0.0018));
  } else {
    view.x -= event.deltaX;
    view.y -= event.deltaY;
    applyView();
  }
}, { passive: false });

function markActive(id) {
  if (activeId) {
    const prev = document.querySelector('.node[data-id="' + activeId + '"]');
    if (prev) prev.classList.remove("active");
  }
  activeId = id;
  if (id) {
    const el = document.querySelector('.node[data-id="' + id + '"]');
    if (el) el.classList.add("active");
  }
}

function openDrawer(id) {
  const n = nodeById[id];
  if (!n) return;
  markActive(id);
  const lane = laneById[n.lane];
  drawerWhere.textContent = lane.title + " · " + n.title;
  const tag = '<span class="tag ' + n.tag + '">' + TAG_TEXT[n.tag] + "</span>";
  let media = "";
  if (n.phone) {
    media = '<img src="' + n.img + '" alt="' + esc(n.title) + ' 截图" /><a class="openfull" href="' + n.img + '" target="_blank" rel="noopener">在新标签打开原图 ↗</a>';
  } else if (n.double) {
    media = '<img src="' + n.double[0] + '" alt="主入口截图" /><p class="cap">主入口 /：完整前端</p><img style="margin-top:8px" src="' + n.double[1] + '" alt="回滚路径截图" /><p class="cap">回滚路径 /legacy：旧简易前端</p><a class="openfull" href="' + n.double[0] + '" target="_blank" rel="noopener">在新标签打开原图 ↗</a>';
  } else if (n.noimg) {
    media = '<div class="quote">' + (n.note || esc(n.desc)) + "</div>";
  } else {
    media = '<img src="' + n.img + '" alt="' + esc(n.title) + ' 截图" /><a class="openfull" href="' + n.img + '" target="_blank" rel="noopener">在新标签打开原图 ↗</a>';
  }
  drawerBody.innerHTML =
    '<div style="display:flex;gap:8px;align-items:center">' + tag + '<span style="font-size:12px;color:#8a7a5c">' + esc(n.sub) + "</span></div>" +
    "<h2>" + esc(n.title) + "</h2>" +
    '<p class="sub">' + esc(media === "" ? "" : "") + "</p>" + media +
    "<h4>用户看到 / 要做什么</h4><p>" + esc(n.desc) + "</p>" +
    (n.user ? "<h4>用户操作</h4><p>" + esc(n.user) + "</p>" : "") +
    (n.system ? "<h4>系统在背后做什么</h4><p>" + esc(n.system) + "</p>" : "") +
    (n.branch ? "<h4>分叉 / 边界</h4><p>" + esc(n.branch) + "</p>" : "") +
    '<div class="src">证据：' + esc(n.src || "") + "<br />数字与例外口径以票 04 / 05 与 PM 2026-10-21 验收记录为准。</div>";
  drawer.setAttribute("aria-hidden", "false");
  document.body.classList.add("drawer-open");
  if (n.phone || n.noimg) {
    const img = drawerBody.querySelector("img");
    if (img) img.addEventListener("click", () => showLightbox(img.src));
  } else if (!n.double) {
    const img = drawerBody.querySelector("img");
    if (img) img.addEventListener("click", () => showLightbox(img.src));
  } else {
    drawerBody.querySelectorAll("img").forEach((img) => img.addEventListener("click", () => showLightbox(img.src)));
  }
}

function closeDrawer() {
  document.body.classList.remove("drawer-open");
  drawer.setAttribute("aria-hidden", "true");
  markActive(null);
}
document.getElementById("drawer-close").addEventListener("click", closeDrawer);

function showLightbox(src) {
  lightbox.querySelector("img").src = src;
  lightbox.classList.add("show");
  lightbox.setAttribute("aria-hidden", "false");
}
lightbox.addEventListener("click", () => {
  lightbox.classList.remove("show");
  lightbox.setAttribute("aria-hidden", "true");
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    if (lightbox.classList.contains("show")) {
      lightbox.classList.remove("show");
      lightbox.setAttribute("aria-hidden", "true");
    } else {
      closeDrawer();
    }
  }
});

renderBoard();
focusLens("transfer");
window.addEventListener("resize", () => { /* 保持当前视图，不强行重排 */ });
</script>
</body>
</html>
