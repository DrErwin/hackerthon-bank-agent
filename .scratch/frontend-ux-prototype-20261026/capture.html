<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>银行助手 · 手机原型图</title><style>*{box-sizing:border-box}body{margin:0;background:#edf0e6;color:#2c3527;font-family:"Microsoft YaHei",sans-serif}header{max-width:1000px;margin:auto;padding:20px 10px 16px;display:flex;align-items:center;justify-content:space-between}h1{font-size:25px;margin:0 0 3px}header p{font-size:14px;margin:0;color:#626d59}a{font-size:14px;color:#93421d;text-underline-offset:4px}.screens{display:flex;justify-content:center;gap:40px}.screen{width:270px}.screen h2{font-size:16px;margin:0 0 10px}.device{width:270px;height:573px;border:6px solid #3b4534;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 8px 26px #3648271a}.device iframe{display:block;width:390px;height:848px;transform:scale(.662);transform-origin:top left;border:0}.note{text-align:center;font-size:13px;color:#5d6857;margin:16px 0 0}</style></head><body><header><div><h1>资料看得见，事情顺着办</h1><p>手机优先交互方案 · 示例资料</p></div><a href="phone.html">打开可点击原型 →</a></header><div class="screens" id="screens"></div><p class="note">点选代替记忆 · 重要资料同屏 · 一句话引导下一步</p><script>const second=new URLSearchParams(location.search).has('more');const views=second?[['请核对一下','confirm'],['看懂每一笔支出','bills'],['认清每一项扣费','subscriptions']]:[['想办什么，一眼找到','home'],['收款人就在手边','people'],['填金额，同时看余额','amount']];document.getElementById('screens').innerHTML=views.map(([name,screen])=>'<section class="screen"><h2>'+name+'</h2><div class="device"><iframe title="'+name+'" src="index.html?embed=1&screen='+screen+'"></iframe></div></section>').join('')</script></body></html>
