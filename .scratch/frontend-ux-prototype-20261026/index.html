function icon(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(icons[n]||icons.help)+'</svg>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const money=v=>Number(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const accounts=[{name:'日常用卡',bank:'工商银行',tail:'6218',balance:12680.50},{name:'养老金卡',bank:'建设银行',tail:'3826',balance:8300.00}];
let people=[{name:'女儿小陈',real:'陈＊',bank:'招商银行',tail:'8806',initial:'陈',color:''},{name:'王阿姨',real:'王＊芳',bank:'中国银行',tail:'3612',initial:'王',color:'sage'},{name:'李师傅',real:'李＊',bank:'农业银行',tail:'5029',initial:'李',color:'gold'}];

const subs=[{name:'视频会员',merchant:'乐享视频科技',price:39,next:'11月10日',history:'近3个月，共扣117元'},{name:'云盘会员',merchant:'云存信息服务',price:10,next:'11月8日',history:'近3个月，共扣30元'}];
const state={view:'home',step:'people',payee:null,account:0,amount:'',search:'',newPerson:false,newChecked:null,savePerson:false,scheduled:false,date:'2026-10-30',billMonth:'10',billCat:'全部',billOpen:null,subId:0,subStep:'list',stopped:new Set(),lifeKind:null,lifeStep:0,lifeStopped:false,lifeDone:false,status:'normal',font:false,records:[],retain:'1500',budget:'500',lifeVideo:true,lifeCloud:false,birthdayFrozen:false,birthdayPaid:0,birthdayWho:'老伴',birthdayDate:'2026-10-30',deliveryName:'王女士',deliveryPhone:'',deliveryAddress:'',savingActive:false,savingQueue:[]};
let timer=null,toastTimer=null,lastTrigger=null;
const $=id=>document.getElementById(id);
function btn(text,action,kind='primary',extra=''){return '<button class="'+kind+'" data-action="'+action+'" '+extra+'>'+text+'</button>'}
function personMini(){const p=state.payee;return p?'<div class="mini-summary"><span class="initial '+p.color+'">'+esc(p.initial)+'</span><div><strong>'+esc(p.name)+'</strong><small>'+esc(p.bank)+' · 尾号 '+esc(p.tail)+'</small></div>'+btn('换一个','change-person','text-btn')+'</div>':''}
function title(h,p='',right=''){return '<div class="page-title"><div><h1>'+h+'</h1>'+(p?'<p class="muted">'+p+'</p>':'')+'</div>'+right+'</div>'}
function helper(t){return '<div class="helper">'+icon('chat')+'<p>'+t+'</p></div>'}
function facts(rows){return '<dl class="facts">'+rows.map(r=>'<div class="fact"><dt>'+r[0]+'</dt><dd>'+r[1]+'</dd></div>').join('')+'</dl>'}
function ask(){return '<button class="ask-mobile" data-action="help">'+icon('chat')+'有不明白的，问问我</button>'}
function steps(){const at=({people:0,amount:1,confirm:2,verify:2,success:3})[state.step]??2;return '<ol class="steps" aria-label="办理步骤">'+['收款人','金额','核对','完成'].map((s,i)=>'<li class="'+(i===at?'active':i<at?'done':'')+'" '+(i===at?'aria-current="step"':'')+'><span class="num">'+(i<at?'✓':i+1)+'</span>'+s+'</li>').join('')+'</ol>'}
function services(){return '<div class="service-grid">'+[['transfer','transfer','转账','给家人朋友转钱'],['bills','bill','查账单','看看钱花在哪'],['subscriptions','repeat','自动扣费','看看哪些在续费'],['life','life','生活安排','一起安排生活开销']].map(([v,i,h,p])=>'<button class="service" data-action="view" data-value="'+v+'"><span class="service-icon">'+icon(i)+'</span><strong>'+h+'</strong><small>'+p+'</small></button>').join('')+'</div>'}
function home(){return '<div class="greeting"><p>王女士，您好</p><h1>今天想办什么？</h1></div>'+services()+'<div class="section-title"><h2>常用账户</h2>'+btn('查看全部','view','text-btn','data-value="profile"')+'</div><div class="card account-brief"><span class="bank-icon">'+icon('card')+'</span><div class="values"><span class="small">工商银行 · 尾号6218</span><strong class="amount">¥12,680.50</strong><span class="small">可用余额 · 10:26 更新</span></div></div><div class="section-title"><h2>常用收款人</h2>'+btn('更多','view','text-btn','data-value="profile"')+'</div><div class="people-short">'+people.slice(0,3).map((p,i)=>'<button class="person-short" data-action="quick-person" data-value="'+i+'"><span class="initial '+p.color+'">'+esc(p.initial)+'</span>'+esc(p.name)+'</button>').join('')+'</div><div class="section-title"><h2>上次还没办完</h2></div><div class="continue-card"><div><strong>给女儿转生活费</strong><p class="small">收款人已选好，接着填金额</p></div>'+btn('继续'+icon('chevron'),'resume','text-btn')+'</div>'+ask()}
function peopleScreen(){let list=state.status==='empty'?[]:people.filter(p=>[p.name,p.real,p.bank,p.tail].join(' ').includes(state.search));return title('转给谁？','',btn(icon('plus')+'新增','add-person','text-btn top-add','aria-label="新增收款人"'))+steps()+'<div class="search-wrap">'+icon('search')+'<label class="sr" for="person-search">查找收款人</label><input class="search-field" id="person-search" placeholder="姓名、备注或卡号尾号" value="'+esc(state.search)+'"></div><p class="people-caption">您的常用收款人</p><div class="choice-grid" id="people-list">'+list.map(p=>personChoice(p)).join('')+(list.length?'':'<div class="empty">'+(state.search?'换个姓名或尾号试试。':'添加一位收款人，开始这次转账。')+'</div>')+'</div>'+(state.newPerson?newPersonForm():'')+'<div class="below-actions">'+btn('填写金额'+icon('arrow'),'to-amount','primary',state.payee?'':'disabled')+'</div>'+ask()}
function personChoice(p){const chosen=state.payee===p;return '<button class="choice person-choice '+(chosen?'selected':'')+'" data-action="person" data-value="'+people.indexOf(p)+'" aria-pressed="'+chosen+'"><span class="initial '+p.color+'">'+esc(p.initial)+'</span><span class="choice-content"><strong>'+esc(p.name)+'<span class="person-real">'+esc(p.real)+'</span></strong><small>'+esc(p.bank)+' · 尾号 '+esc(p.tail)+'</small></span><span class="check">'+(chosen?icon('check'):'')+'</span></button>'}
function newPersonForm(){if(state.newChecked){const p=state.newChecked;return '<section class="card" style="margin-top:14px"><h2>核对收款人</h2><p class="note">以下为原型中的核对结果</p>'+facts([['姓名',esc(p.real)],['收款银行',esc(p.bank)],['银行卡', '尾号 '+esc(p.tail)]])+btn('使用这位收款人','use-new','primary wide')+'</section>'}return '<section class="card" style="margin-top:14px"><div class="row"><h2>新收款人</h2>'+btn('收起','add-person','text-btn')+'</div><form id="new-person-form"><div class="field"><label for="new-name">收款人姓名</label><input id="new-name" placeholder="例如：陈晓华" autocomplete="off" required></div><div class="field"><label for="new-number">收款银行卡号</label><input id="new-number" inputmode="numeric" placeholder="请使用示例卡号体验" autocomplete="off" required></div><div class="field"><label for="new-remark">怎么称呼（选填）</label><input id="new-remark" placeholder="例如：女儿、房东" autocomplete="off"></div><label class="row" style="justify-content:start;margin:18px 0;font-size:17px"><input class="toggle-input" type="checkbox" id="save-person">保存为常用收款人</label><p class="error" id="new-error" role="alert"></p><button class="primary wide">核对收款资料</button></form></section>'}
function accountChoices(){return '<div class="choice-grid">'+accounts.map((a,i)=>'<button class="choice '+(state.account===i?'selected':'')+'" data-action="account" data-value="'+i+'" aria-pressed="'+(state.account===i)+'"><span class="bank-icon">'+icon('card')+'</span><span class="choice-content"><strong>'+a.name+'</strong><small>'+a.bank+' · '+a.tail+'</small><small>可用 <b>¥'+money(a.balance)+'</b></small></span><span class="check">'+(state.account===i?icon('check'):'')+'</span></button>').join('')+'</div>'}
function amountScreen(){const a=accounts[state.account];return title('转多少钱？')+steps()+personMini()+'<div class="card card-compact"><label for="amount"><strong>转账金额</strong></label><div class="number-input"><span>¥</span><input id="amount" inputmode="decimal" autocomplete="off" placeholder="0.00" value="'+esc(state.amount)+'"></div><p class="money-help" id="money-hint">'+(state.amount?'将转出 '+money(state.amount)+' 元':'填好金额后，我们一起核对。')+'</p><p class="error" id="amount-error" role="alert"></p></div><div class="selected-bank"><div class="row" style="margin-bottom:10px"><h2>付款账户</h2>'+btn('换张卡','choose-account','text-btn')+'</div><div class="choice"><span class="bank-icon">'+icon('card')+'</span><span class="choice-content"><strong>'+a.name+'</strong><small>'+a.bank+' · '+a.tail+'</small><small>可用 <b>¥'+money(a.balance)+'</b></small></span></div><div class="row"><p class="card-guide">余额更新于10:26</p>'+btn('更新','refresh','text-btn')+'</div></div><div class="money-date"><span>转账时间</span><div class="time-options">'+btn('现在转','time-now','chip '+(!state.scheduled?'selected':''))+btn('选日期','time-later','chip '+(state.scheduled?'selected':''))+'</div></div>'+(state.scheduled?'<div class="field"><label for="transfer-date">转账日期</label><input id="transfer-date" type="date" min="2026-10-27" value="'+state.date+'"></div>':'')+'<div class="below-actions">'+btn('上一步','change-person','quiet')+btn('核对这笔转账'+icon('arrow'),'to-confirm')+'</div>'+ask()}
function transferFacts(){const p=state.payee||people[0],a=accounts[state.account];return facts([['收款人',esc(p.name)+'<small>'+esc(p.real)+' · '+esc(p.bank)+' '+esc(p.tail)+'</small>'],['付款账户',a.bank+'<small>'+a.name+' · 尾号 '+a.tail+'</small>'],['转账时间',state.scheduled?state.date:'现在转'],['手续费','¥0.00']])}
function confirmScreen(){return title('请核对一下')+steps()+helper('收款人和金额都对，就可以确认了。')+'<section class="card"><div class="check-amount"><small>'+ (state.scheduled?'预约转账金额':'转账金额')+'</small>¥'+money(state.amount||300)+'</div>'+transferFacts()+'</section><div class="below-actions">'+btn('修改资料','edit-transfer','secondary')+btn(state.scheduled?'确认预约':'确认转账','confirm-transfer')+'</div>'+btn('先不办了','cancel-transfer','quiet wide')+ask()}
function verifyScreen(){return title('验证一下身份')+steps()+personMini()+'<section class="card"><h2>填写短信验证码</h2><p class="note">验证码已发至 138 **** 0618</p><p>本次转账 <strong>¥'+money(state.amount||300)+'</strong></p><form id="verify-form"><div class="field"><label for="code">6位验证码</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="原型体验：123456"></div><p class="error" id="code-error" role="alert"></p><div class="below-actions"><button class="primary wide">验证并继续</button></div></form>'+btn('重新获取验证码','resend','text-btn wide')+'</section>'+btn('返回核对','back-confirm','quiet wide')+ask()}
function successScreen(){return '<div class="status-icon">'+icon('check')+'</div><h1 class="status-title">'+(state.scheduled?'已安排好转账':'转账成功')+'</h1><p class="status-copy">'+(state.scheduled?'预约日期到了，银行会按约定办理。':'这笔转账已办好，回执在这里。')+'</p><div class="check-amount" style="margin-top:20px">¥'+money(state.amount||300)+'</div><section class="card">'+transferFacts()+facts([['办理时间','10月26日 10:28']])+'</section><div class="below-actions">'+btn('查看回执','receipt','secondary')+btn('回到首页','view','primary','data-value="home"')+'</div>'+ask()}
function stateScreen(){const d={loading:['clock','正在转账','银行正在处理，结果会显示在这里。','查看进度','check-result'],unknown:['clock','银行正在核实结果','请查看这笔转账的最新进度。','查看进度','check-result'],failed:['help','这次转账没成功','银行提示：这张卡的可用余额不足。','换张卡或改金额','edit-transfer'],resume:['history','接着办上次的转账','给女儿的转账资料已经找回。','核对并继续','resume-confirm'],risk:['shield','先核实一下这通来电','对方要求保密并催促转账。请先挂断，使用银行卡上的客服电话核实。','查看核实方法','risk-help'],face:['shield','还需要一次身份核验','这是首次向这位收款人转账，请按银行提示完成核验。','查看核验说明','face-help']}[state.status];return '<div class="status-icon">'+icon(d[0])+'</div>'+title(d[1],d[2])+'<div class="card"><div class="check-amount"><small>这笔转账</small>¥'+money(state.amount||300)+'</div>'+transferFacts()+'</div><div class="below-actions">'+btn(d[3],d[4])+'</div>'+btn('查看办理记录','view','quiet wide','data-value="history"')+ask()}
function transfer(){if(!['normal','empty','offline'].includes(state.status))return stateScreen();return (state.status==='offline'?'<div class="notice">'+icon('clock')+'<div><strong>连接暂时中断</strong><p>资料保留着，连接恢复后接着办。</p>'+btn('重新连接','reconnect','text-btn')+'</div></div>':'')+({people:peopleScreen,amount:amountScreen,confirm:confirmScreen,verify:verifyScreen,success:successScreen}[state.step]||peopleScreen)()}

function openHelp(){openDrawer('问问小助手','<div class="chat-reply" id="chat-reply" role="status">'+helpText()+'</div><div class="help-links">'+btn('我有哪些收款人？','help-people','chip')+btn('这张卡有多少钱？','help-balance','chip')+btn('想改一下金额','help-amount','chip')+'</div><form class="chat-form" id="chat-form"><label class="sr" for="chat-text">您的问题</label><input id="chat-text" placeholder="写下您的问题"><button class="primary">发送</button></form><p class="note">原型演示：可试问收款人、余额或修改金额。</p>')}
function finishTransfer(){clearTimeout(timer);state.status='normal';state.step='success';state.records.unshift({title:(state.scheduled?'预约转账给':'转账给')+esc(state.payee?.name||'女儿小陈'),detail:'¥'+money(state.amount||300)+' · 10月26日',status:state.scheduled?'已预约':'已办好'});render(true)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value;switch(a){case'view':state.view=v;if(v==='transfer'&&state.step==='success'){state.step='people';state.amount='';state.payee=null}render(true);break;case'font':state.font=!state.font;render();toast(state.font?'已切换为大字':'已恢复标准字号');break;case'help':openHelp();break;case'close':closeDrawer();break;case'person':state.payee=people[+v];render();break;case'quick-person':state.view='transfer';state.status='normal';state.payee=people[+v];state.step='amount';render(true);break;case'to-amount':state.step='amount';state.status='normal';render(true);break;case'change-person':state.step='people';render(true);break;case'add-person':state.newPerson=!state.newPerson;state.newChecked=null;render();if(state.newPerson)$('new-name').focus();break;case'profile-add':state.view='transfer';state.step='people';state.newPerson=true;state.newChecked=null;render(true);$('new-name').focus();break;case'use-new':state.payee=state.newChecked;if(state.savePerson)people.push(state.newChecked);state.newPerson=false;state.newChecked=null;state.step='amount';state.status='normal';render(true);break;case'account':state.account=+v;render();break;case'refresh':toast('余额已更新，当前示例金额保持一致。');break;case'time-now':state.scheduled=false;render();break;case'time-later':state.scheduled=true;render();break;case'to-confirm':{const n=Number(state.amount);if(!/^\d+(\.\d{1,2})?$/.test(state.amount)||n<=0){$('amount-error').textContent='请填写大于0的金额，最多两位小数。';$('amount').focus();break}if(n>accounts[state.account].balance){$('amount-error').textContent='这张卡余额不足，请换张卡或调整金额。';break}state.step='confirm';render(true);break}case'edit-transfer':state.status='normal';state.step='amount';render(true);break;case'confirm-transfer':state.step='verify';render(true);break;case'back-confirm':state.step='confirm';render(true);break;case'cancel-transfer':state.records.unshift({title:'转账给'+esc(state.payee?.name||'收款人'),detail:'10月26日 · 资料已保留',status:'已取消'});state.view='history';state.step='people';render(true);toast('已取消这次办理。');break;case'resend':toast('验证码已重新发送，体验码为123456。');break;case'receipt':openDrawer('转账回执','<p class="badge">原型示例回执</p><div class="check-amount">¥'+money(state.amount||300)+'</div>'+transferFacts()+facts([['回执编号','DEMO-20261026-001']])+btn('看完了','close','primary wide'));break;case'check-result':state.status='loading';render();clearTimeout(timer);timer=setTimeout(finishTransfer,1000);break;case'reconnect':state.status='normal';render();toast('已重新连接，可以接着办。');break;case'resume':state.view='transfer';state.step='amount';state.status='normal';state.payee=people[0];render(true);break;case'resume-confirm':state.status='normal';state.step='confirm';render(true);break;case'risk-help':openDrawer('先核实来电','<p>先挂断这通电话，再拨打银行卡背面的客服电话。</p><p class="note">说明对方让您转账的原因，请银行帮助核实。</p>'+btn('知道了','close','primary wide'));break;case'face-help':openDrawer('进一步核验','<p>正式办理时，此处衔接银行提供的身份核验。</p><p class="note">本原型展示等待、核验成功和核验失败后的页面；不采集人脸资料。</p>'+btn('返回办理页','close','primary wide'));break;case'month':state.billMonth=v;state.billOpen=null;render();break;case'bill-cat':state.billCat=v;state.billOpen=null;render();break;case'bill-open':state.billOpen=state.billOpen===+v?null:+v;render();break;case'bill-all':openDrawer(Number(state.billMonth)+'月账单明细','<p class="note">工商银行 · 6218　共8笔</p>'+bills.map(x=>'<div class="fact"><span>'+x.name+'<small class="small" style="display:block">'+billDate(x)+'</small></span><strong>−'+money(billValue(x))+'</strong></div>').join(''));break;case'bill-account':openDrawer('选择查询账户','<p>当前查看工商银行尾号6218。</p><p class="note">原型另一张卡暂无账单示例，您可继续查看当前账单。</p>'+btn('继续查看','close','primary wide'));break;case'bill-check':{const x=bills[+v];openDrawer('一起核对这笔扣款',facts([['商户',x.name],['扣款金额','¥'+money(billValue(x))],['日期',billDate(x)],['付款卡','工商银行 · 6218']])+'<p class="note">您可以先对照购物小票或付款记录。</p>'+btn(x.type==='自动扣费'?'看看自动扣费':'查看核对方法',x.type==='自动扣费'?'drawer-subs':'check-method','primary wide'));break}case'check-method':$('drawer-content').innerHTML='<p>先对照当天的购物、就医或缴费记录；仍不认识这笔钱，可以拨打银行卡背面的客服电话核实。</p>'+btn('知道了','close','primary wide');break;case'drawer-subs':closeDrawer();state.view='subscriptions';render(true);break;case'sub-stop':state.subId=+v;state.subStep='confirm';render(true);break;case'sub-back':state.subStep='list';render(true);break;case'sub-verify':state.subStep='verify';render(true);break;case'sub-receipt':openDrawer('停扣回执',facts([['项目',subs[+v].name],['结果','已停止自动扣费'],['生效日期',subs[+v].next+'起'],['原每月扣费','¥'+money(subs[+v].price)]])+btn('看完了','close','primary wide'));break;case'suspect':openDrawer('悦读服务扣费记录','<p>8月、9月、10月各扣15元，商户名为“悦读信息服务”。</p><p class="note">请对照阅读软件的订阅记录，或联系对应商户核实。</p>'+btn('知道了','close','primary wide'));break;case'life-kind':state.lifeKind=v;state.lifeStep=0;state.lifeStopped=false;state.lifeDone=false;render(true);break;case'life-reset':state.lifeKind=null;state.lifeStep=0;render(true);break;case'life-next':if(state.lifeKind==='pension'&&(+state.retain<49||+state.retain>5000)){toast('请在49至5,000元之间确定生活费。');break}state.lifeStep++;render(true);break;case'life-prev':state.lifeStep=Math.max(0,state.lifeStep-1);render(true);break;case'life-stop':state.lifeStopped=true;render(true);break;case'life-resume':state.lifeStopped=false;render(true);break;case'life-verify':openDrawer('验证这笔转账','<p>转到本人日常用卡 ¥'+money(5000-Number(state.retain))+'</p><form id="life-code-form"><div class="field"><label for="life-code">短信验证码</label><input id="life-code" inputmode="numeric" maxlength="6" placeholder="原型体验：123456"></div><p class="error" id="life-error" role="alert"></p><div class="below-actions"><button class="primary wide">验证并继续</button></div></form>');break;case'saving-confirm':state.savingActive=true;state.savingQueue=[0,1].filter(i=>(i===0?state.lifeVideo:state.lifeCloud)&&!state.stopped.has(i));state.subId=state.savingQueue[0]??0;state.view='subscriptions';state.subStep='confirm';render(true);break;case'birthday-freeze':openDrawer('核对预算预留',facts([['本次预算','¥'+money(state.budget)],['付款卡','工商银行 · 6218'],['用途','鲜花与生日蛋糕']])+'<p class="note">预算预留后，将分别核对两项付款；结束时核对已用金额和可释放余款。</p>'+btn('返回生日安排','close','primary wide'));break;case'historic':state.view='bills';render(true);break;case'history-item':openDrawer('办理记录','<h3>'+state.records[+v].title+'</h3><p class="note">'+state.records[+v].detail+'</p><span class="badge">'+state.records[+v].status+'</span>');break;case'help-people':$('chat-reply').innerHTML='您有'+people.length+'位常用收款人：'+people.map(x=>esc(x.name)).join('、')+'。<br>'+btn('打开收款人列表','help-pick','text-btn');break;case'help-pick':closeDrawer();state.view='transfer';state.step='people';render(true);break;case'help-balance':$('chat-reply').textContent=accounts[state.account].bank+'尾号'+accounts[state.account].tail+'，可用余额'+money(accounts[state.account].balance)+'元。';break;case'help-amount':$('chat-reply').innerHTML='可以，已选的收款人会保留。'+btn('去修改金额','help-edit','text-btn');break;case'help-edit':closeDrawer();state.view='transfer';state.step=state.payee?'amount':'people';state.status='normal';render(true);break;}});
document.addEventListener('input',e=>{const id=e.target.id,v=e.target.value;if(id==='amount'){state.amount=v;$('money-hint').textContent=v&&Number.isFinite(Number(v))?'将转出 '+money(v)+' 元':'填好金额后，我们一起核对。';$('amount-error').textContent='';$('rail').innerHTML=rail()}if(id==='person-search'){state.search=v;const list=(state.status==='empty'?[]:people).filter(p=>[p.name,p.real,p.bank,p.tail].join(' ').includes(v));$('people-list').innerHTML=list.length?list.map(personChoice).join(''):'<div class="empty">换个姓名或尾号试试，也可以新增收款人。</div>'}if(id==='retain')state.retain=v;if(id==='budget')state.budget=v;if(id==='transfer-date')state.date=v;if(id==='save-sub-0')state.lifeVideo=e.target.checked;if(id==='save-sub-1')state.lifeCloud=e.target.checked});
document.addEventListener('submit',e=>{e.preventDefault();switch(e.target.id){case'new-person-form':{const name=$('new-name').value.trim(),number=$('new-number').value.replace(/\s/g,''),remark=$('new-remark').value.trim();if(!name||!/^\d{12,19}$/.test(number)){$('new-error').textContent='请填写姓名和12至19位示例银行卡号。';break}state.savePerson=$('save-person').checked;state.newChecked={name:remark||name.slice(0,1)+'＊',real:name.slice(0,1)+'＊',bank:'演示银行',tail:number.slice(-4),initial:name.slice(0,1),color:'sage'};render();break}case'verify-form':if($('code').value!=='123456'){$('code-error').textContent='请使用原型验证码123456体验。';break}state.status='loading';render(true);timer=setTimeout(finishTransfer,900);break;case'sub-verify-form':if($('sub-code').value!=='123456'){$('sub-error').textContent='请使用原型验证码123456体验。';break}state.stopped.add(state.subId);state.records.unshift({title:subs[state.subId].name+'停扣',detail:subs[state.subId].next+'起 · 原每月'+subs[state.subId].price+'元',status:'已停扣'});state.subStep='list';render(true);toast('已停扣，生效日期保留在原卡片里。');break;case'life-code-form':if($('life-code').value!=='123456'){$('life-error').textContent='请使用原型验证码123456体验。';break}closeDrawer();state.lifeDone=true;state.records.unshift({title:'安排本月养老金',detail:'转到日常用卡 ¥'+money(5000-Number(state.retain)),status:'已办好'});render(true);break;case'birthday-form':state.birthdayWho=$('birthday-who').value.trim();state.birthdayDate=$('birthday-date').value;if(!Number.isFinite(+state.budget)||+state.budget<467){toast('这组礼物合计467元，请调整预算。');break}state.lifeStep=1;render(true);break;case'delivery-form':state.deliveryName=$('delivery-name').value;state.deliveryPhone=$('delivery-phone').value;state.deliveryAddress=$('delivery-address').value;state.lifeStep=3;render(true);break;case'chat-form':{const q=$('chat-text').value.trim();if(!q)break;$('chat-text').value='';$('chat-reply').textContent=/收款|女儿/.test(q)?'常用收款人包括'+people.map(p=>p.name).join('、')+'，点下面的“我有哪些收款人”可以打开列表。':/余额|多少.*钱/.test(q)?'当前付款卡可用余额为'+money(accounts[state.account].balance)+'元。':/改|金额/.test(q)?'点“想改一下金额”，已选收款人会保留。':'这版先演示收款人、余额和修改金额。您可以点下面的选项继续体验。';break}}});

function billValue(b){return state.billMonth==='09'&&b===bills[0]?352:b.value}
function billDate(b){return b.date.replace('10月',Number(state.billMonth)+'月')}
function savingContinuation(){if(!state.savingActive)return '';const remaining=state.savingQueue.filter(i=>!state.stopped.has(i));return '<div class="card" style="margin-bottom:18px"><h2>继续这次减支安排</h2><p class="note">'+(remaining.length?'还有'+remaining.length+'项等您核对。':'您选择的项目都已停扣。')+'</p>'+btn(remaining.length?'核对下一项：'+subs[remaining[0]].name:'查看这次安排',remaining.length?'saving-next':'saving-done','primary wide')+btn('先到这里','saving-pause','quiet wide')+'</div>'}
function savingResult(){const done=state.savingQueue.filter(i=>state.stopped.has(i));return title(state.lifeStopped?'减支安排已暂停':'这次减支安排已办好')+helper('停扣结果和待办项目都保留在这里。')+'<div class="card">'+planSummary(state.savingQueue.map(i=>[subs[i].name,'原每月'+subs[i].price+'元 · '+subs[i].next+(state.stopped.has(i)?'起停扣':'为下次扣费日期'),state.stopped.has(i)?'已停扣':'待核对']))+facts([['已停扣',done.length+'项'],['每月将少扣','¥'+money(done.reduce((a,i)=>a+subs[i].price,0))]])+'</div><div class="below-actions">'+btn('回到首页','view','primary','data-value="home"')+'</div>'+ask()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='saving-next'){state.subId=state.savingQueue.find(i=>!state.stopped.has(i));state.subStep='confirm';render(true)}if(a==='saving-done'||a==='saving-pause'){state.savingActive=false;state.view='life';state.lifeKind='saving';state.lifeStopped=a==='saving-pause';state.lifeDone=a==='saving-done';render(true)}});
$('drawer').addEventListener('close',()=>{if(lastTrigger?.isConnected){lastTrigger.focus();return}const a=lastTrigger?.dataset?.action;if(a){const target=document.querySelector('[data-action="'+a+'"]');target?.focus()}});

$('state-preview').addEventListener('change',e=>{clearTimeout(timer);state.view='transfer';state.status=e.target.value;state.payee=people[0];state.amount='300';state.step=state.status==='empty'?'people':state.status==='offline'?'amount':'confirm';render(true)});
$('design-link').addEventListener('click',e=>{e.preventDefault();state.view='design';render(true)});
$('drawer').addEventListener('click',e=>{if(e.target===$('drawer'))closeDrawer()});
const params=new URLSearchParams(location.search);if(params.has('embed'))document.body.classList.add('embed');const initial=params.get('screen');if(initial==='people'){state.view='transfer'}if(initial==='amount'||initial==='confirm'){state.view='transfer';state.step=initial;state.payee=people[0];state.amount=initial==='confirm'?'300':''}if(['bills','subscriptions','life','profile','history'].includes(initial))state.view=initial;if(initial==='pension'){state.view='life';state.lifeKind='pension';state.lifeStep=1}if(location.hash==='#design')state.view='design';$('brand-icon').innerHTML=icon('bank');render();
</script>
</body>
