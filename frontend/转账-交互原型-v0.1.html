<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>转账 · 交互原型 v0.2</title>
<style>
  :root{
    --brand:#FF6A00; --brand-press:#E05E00; --brand-tint:#FFF1E6;
    --success:#067647; --danger:#B42318; --warning:#B54708;
    --ink:#111827; --ink2:#374151; --ink3:#6B7280;
    --bg:#F5F6F8; --card:#FFFFFF; --border:#D0D5DD;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#E9E7E4;
    padding:26px;
    display:flex; justify-content:center;
  }
  .phone{
    width:390px; height:800px; background:var(--bg);
    border-radius:36px; overflow:hidden;
    box-shadow:0 14px 44px rgba(0,0,0,.20), 0 2px 8px rgba(0,0,0,.10);
    display:flex; flex-direction:column; position:relative;
  }

  /* 顶部栏 */
  .topbar{
    height:60px; background:var(--card); flex:0 0 auto;
    display:flex; align-items:center; gap:10px; padding:0 18px;
    border-bottom:1px solid var(--border);
  }
  .topbar .title{font-size:19px; font-weight:700; color:var(--ink);}
  .topbar .status{margin-left:auto; font-size:14px; color:var(--success); display:flex; align-items:center; gap:5px;}
  .topbar .status .dot{width:8px; height:8px; border-radius:50%; background:var(--success);}
  .topbar .reset{
    font-size:15px; color:var(--ink2); background:transparent; border:1px solid var(--border);
    border-radius:10px; padding:5px 10px; cursor:pointer;
  }

  /* 聊天流 */
  .chat{flex:1 1 auto; overflow-y:auto; padding:16px 14px 8px; display:flex; flex-direction:column; gap:12px;}
  .chat::-webkit-scrollbar{width:0;}
  .msg{max-width:82%; animation:up .25s ease;}
  @keyframes up{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .msg .bubble{
    font-size:18px; line-height:1.55; color:var(--ink);
    padding:12px 14px; border-radius:16px; word-break:break-word;
  }
  .msg .time{font-size:14px; color:var(--ink3); margin:4px 6px 0;}
  .msg.user{align-self:flex-end; text-align:right;}
  .msg.user .bubble{background:var(--brand-tint); border:1px solid #FFE3C8;}
  .msg.assistant{align-self:flex-start;}
  .msg.assistant .bubble{background:var(--card); border:1px solid var(--border);}
  .msg .bubble b{font-weight:700;}

  /* 打字中 */
  .typing{display:flex; gap:5px; align-items:center; height:24px;}
  .typing span{width:7px; height:7px; border-radius:50%; background:var(--ink3); animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  /* 引导卡片 */
  .cards{align-self:flex-start; width:100%; display:flex; flex-direction:column; gap:10px;}
  .cards .hint{font-size:16px; color:var(--ink2); margin-bottom:2px;}
  .card{
    width:100%; min-height:48px; background:var(--card); border:1px solid var(--border);
    border-radius:16px; font-size:18px; color:var(--ink); padding:12px 16px;
    cursor:pointer; text-align:left; transition:.15s;
  }
  .card:active{background:var(--brand-tint); border-color:var(--brand);}
  .card.picked{background:var(--brand-tint); border-color:var(--brand);}
  .card b{color:var(--brand);}
  .card .sub{display:block; margin-top:4px; font-size:15px; color:var(--ink3);}
  .card[disabled], .btn[disabled]{opacity:.72; cursor:default;}
  .history-card{opacity:.78; box-shadow:none;}
  .history-list{display:flex; flex-direction:column; gap:8px; font-size:16px; color:var(--ink2);}
  .history-list div{padding:8px 10px; border-radius:9px; background:var(--bg);}

  /* 确认单 */
  .confirm-card{align-self:flex-start; width:100%; background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:12px; box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .confirm-card .cc-title{font-size:22px; font-weight:700; color:var(--ink);}
  .cc-row{display:flex; justify-content:space-between; align-items:center; font-size:18px; color:var(--ink2);}
  .cc-row b{color:var(--ink); font-weight:700;}
  .cc-row.amount b{font-size:28px; font-weight:700; color:var(--ink);}
  .cc-btns{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
  .btn{
    width:100%; min-height:56px; border-radius:12px; font-size:18px; font-weight:700;
    cursor:pointer; border:none; transition:.15s;
  }
  .btn.primary{background:var(--brand); color:var(--ink);}
  .btn.primary:active{background:var(--brand-press);}
  .btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--border);}
  .btn.ghost:active{background:var(--bg);}
  .btn:disabled{background:var(--border); color:var(--ink3); cursor:not-allowed;}

  /* 验证码 */
  .code-card{align-self:flex-start; width:100%; background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:14px;}
  .code-demo{font-size:16px; color:var(--ink2); background:var(--brand-tint); border-radius:10px; padding:10px 12px;}
  .code-demo b{font-size:20px; color:var(--brand); letter-spacing:2px;}
  .code-boxes{display:flex; gap:8px; justify-content:space-between;}
  .cb{
    width:46px; height:56px; text-align:center; font-size:24px; font-weight:700; color:var(--ink);
    border:1px solid var(--border); border-radius:12px; background:var(--bg);
  }
  .cb:focus{outline:none; border-color:var(--brand); background:var(--brand-tint);}
  .code-err{font-size:16px; color:var(--danger); min-height:20px;}
  .verify-choice{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .face-mark{width:92px; height:92px; margin:2px auto; border:3px solid var(--brand); border-radius:28px;
    display:flex; align-items:center; justify-content:center; font-size:44px; background:var(--brand-tint);}
  .safe-note{font-size:15px; line-height:1.5; color:var(--ink2); text-align:center;}
  .admin-zone{border:1px dashed var(--warning); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px; background:#FFF9F0;}
  .admin-zone-title{font-size:16px; font-weight:700; color:var(--warning); text-align:center;}

  /* 修改与恢复 */
  .edit-grid{display:flex; flex-direction:column; gap:12px;}
  .field{display:flex; flex-direction:column; gap:6px; font-size:16px; color:var(--ink2);}
  .field select,.field input{width:100%; min-height:52px; border:1px solid var(--border); border-radius:12px;
    background:var(--bg); color:var(--ink); font-size:18px; padding:0 12px;}
  .recovery-card{align-self:flex-start; width:100%; padding:18px; border:2px solid var(--brand); border-radius:16px;
    background:var(--card); display:flex; flex-direction:column; gap:12px;}
  .recovery-card .cc-title{font-size:21px; font-weight:700;}
  .recovery-card p{margin:0; font-size:17px; line-height:1.55; color:var(--ink2);}

  /* 处理中 */
  .prog{display:flex; align-items:center; gap:10px; font-size:18px; color:var(--ink2); padding:16px; justify-content:center;}
  .spinner{width:20px; height:20px; border:3px solid var(--brand-tint); border-top-color:var(--brand); border-radius:50%; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 结果卡 */
  .result-card{align-self:flex-start; width:100%; background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:8px; text-align:center;}
  .rc-status{display:inline-flex; align-items:center; gap:8px; font-size:18px; font-weight:700; justify-content:center; padding:8px 12px; border-radius:10px;}
  .rc-status.success{background:#E7F6EF; color:var(--success);}
  .rc-status .ico{width:22px; height:22px; border-radius:50%; background:var(--success); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:14px;}
  .rc-amount{font-size:32px; font-weight:700; color:var(--ink); margin:6px 0;}
  .rc-line{font-size:18px; color:var(--ink2);}
  .rc-line b{color:var(--ink);}
  .rc-note{font-size:16px; color:var(--ink2); margin-top:6px;}

  @media (max-width:430px){
    body{padding:0; background:var(--bg);}
    .phone{width:100vw; height:100dvh; min-height:640px; border-radius:0; box-shadow:none;}
  }

  /* 输入栏 */
  .inputbar{
    flex:0 0 auto; height:68px; background:var(--card); border-top:1px solid var(--border);
    display:flex; align-items:center; gap:8px; padding:0 12px;
  }
  .mic{
    width:48px; height:48px; border-radius:50%; background:var(--card); border:1px solid var(--border);
    font-size:22px; cursor:pointer; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  }
  .mic.recording{background:var(--brand); color:#fff; border-color:var(--brand);}
  #msginput{
    flex:1 1 auto; height:56px; border:1px solid var(--border); border-radius:12px;
    font-size:18px; color:var(--ink); padding:0 14px; background:var(--bg); outline:none;
  }
  #msginput:focus{border-color:var(--brand); background:var(--card);}
  .send{
    width:56px; height:56px; border-radius:12px; background:var(--brand); color:var(--ink);
    font-size:18px; font-weight:700; border:none; cursor:pointer; flex:0 0 auto;
  }
  .send:active{background:var(--brand-press);}
  .send:disabled{background:var(--border); color:var(--ink3);}

  /* 录音浮层 */
  #recording{
    position:absolute; left:0; right:0; bottom:68px; background:rgba(17,24,39,.92);
    padding:18px; display:none; align-items:center; justify-content:center; gap:14px; z-index:10;
  }
  #recording.show{display:flex;}
  #recording .label{color:#fff; font-size:19px; font-weight:700;}
  .wave{display:flex; gap:4px; align-items:center; height:26px;}
  .wave i{width:4px; border-radius:2px; background:var(--brand); animation:wave 1s infinite ease-in-out;}
  .wave i:nth-child(1){height:8px; animation-delay:0s;}
  .wave i:nth-child(2){height:18px; animation-delay:.15s;}
  .wave i:nth-child(3){height:26px; animation-delay:.3s;}
  .wave i:nth-child(4){height:16px; animation-delay:.45s;}
  .wave i:nth-child(5){height:8px; animation-delay:.6s;}
  @keyframes wave{0%,100%{transform:scaleY(.6);} 50%{transform:scaleY(1.3);}}
</style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <div class="title">AI 银行助手</div>
      <div class="status"><span class="dot"></span>已连接</div>
      <button class="reset" onclick="resetDemo()">↻ 重来</button>
    </div>

    <div class="chat" id="chat"></div>

    <div id="recording">
      <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="label">正在听，您请说…</div>
    </div>

    <div class="inputbar">
      <button class="mic" id="mic" title="按住说话">🎤</button>
      <input id="msginput" placeholder="说点什么…" autocomplete="off">
      <button class="send" id="send">发送</button>
    </div>
  </div>

<script>
  var chat = document.getElementById('chat');
  var input = document.getElementById('msginput');
  var sendBtn = document.getElementById('send');
  var mic = document.getElementById('mic');
  var rec = document.getElementById('recording');
  var busy = false;
  var storageKey = 'bank-transfer-prototype-v02';
  var isAdminMode = new URLSearchParams(window.location.search).get('mode') === 'admin';
  var transfer = {payee:'妈妈', tail:'6688', account:'主账户（尾号 1234）', amount:'500.00'};
  var taskHistory = [];

  function esc(s){ return s.replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function scrollBottom(){ chat.scrollTop = chat.scrollHeight; }

  function addMsg(role, inner){
    var d = document.createElement('div');
    d.className = 'msg ' + role;
    d.innerHTML = '<div class="bubble">' + inner + '</div><div class="time">' + now() + '</div>';
    chat.appendChild(d); scrollBottom(); return d;
  }
  function now(){
    var t = new Date(); var h = t.getHours(), m = t.getMinutes();
    if(m < 10) m = '0' + m; return h + ':' + m;
  }
  function addUser(text){ addMsg('user', esc(text)); }
  function addAssistant(text){ addMsg('assistant', esc(text)); }
  function money(){ return Number(transfer.amount).toFixed(2); }
  function saveStage(stage){
    localStorage.setItem(storageKey, JSON.stringify({stage:stage, transfer:transfer, history:taskHistory}));
  }
  function clearStage(){ localStorage.removeItem(storageKey); }
  function resetTaskData(){
    clearStage(); taskHistory = [];
    transfer = {payee:'妈妈', tail:'6688', account:'主账户（尾号 1234）', amount:'500.00'};
  }
  function recordHistory(text){ taskHistory.push(text); }
  function loadSavedState(){
    var saved;
    try{ saved = JSON.parse(localStorage.getItem(storageKey)); }catch(e){ return null; }
    var stages = ['confirmation','verification','face','face_passed','face_failed','processing','result'];
    if(!saved || stages.indexOf(saved.stage) < 0 || !saved.transfer) return null;
    var t = saved.transfer;
    if(typeof t.payee !== 'string' || typeof t.tail !== 'string' || typeof t.account !== 'string' || typeof t.amount !== 'string') return null;
    if(!/^\d+(\.\d{1,2})?$/.test(t.amount) || Number(t.amount) <= 0) return null;
    saved.history = Array.isArray(saved.history) ? saved.history.filter(function(item){ return typeof item === 'string'; }).slice(-8) : [];
    return saved;
  }
  function disableCard(wrap, label){
    wrap.classList.add('history-card');
    var buttons = wrap.querySelectorAll('button,input,select');
    for(var i=0;i<buttons.length;i++) buttons[i].disabled = true;
    if(label){
      var note = document.createElement('div'); note.className = 'safe-note'; note.textContent = label; wrap.appendChild(note);
    }
  }

  function typing(){
    var d = document.createElement('div');
    d.className = 'msg assistant';
    d.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
    chat.appendChild(d); scrollBottom(); return d;
  }

  /* 引导卡片 */
  function addCards(){
    var wrap = document.createElement('div');
    wrap.className = 'cards';
    wrap.innerHTML =
      '<div class="hint">请选择收款人：</div>' +
      '<button class="card" onclick="pickPayee(this,\'妈妈\',\'6688\')"><b>妈妈</b> · 尾号 6688<span class="sub">常用收款人</span></button>' +
      '<button class="card" onclick="pickPayee(this,\'张阿姨\',\'3166\')"><b>张阿姨</b> · 尾号 3166<span class="sub">最近转过</span></button>' +
      '<button class="card" onclick="showEdit(this)">都不是，我要修改信息</button>';
    chat.appendChild(wrap); scrollBottom();
  }

  async function pickPayee(el, name, tail){
    if(busy) return; busy = true;
    transfer.payee = name; transfer.tail = tail;
    el.classList.add('picked');
    var others = el.parentNode.querySelectorAll('.card');
    for(var i=0;i<others.length;i++) others[i].disabled = true;
    await sleep(500);
    addAssistant('您选择了' + name + '（尾号 ' + tail + '），请再确认完整信息。');
    await sleep(500);
    addConfirmCard();
    busy = false;
  }

  function showEdit(el){
    if(busy) return; busy = true;
    var cards = el.closest('.cards');
    if(cards){
      var options = cards.querySelectorAll('button');
      for(var i=0;i<options.length;i++) options[i].disabled = true;
    }
    var wrap = document.createElement('div');
    wrap.className = 'confirm-card';
    wrap.innerHTML =
      '<div class="cc-title">修改转账信息</div><div class="edit-grid">' +
      '<label class="field">收款人<select id="editPayee"><option value="妈妈|6688">妈妈 · 尾号 6688</option><option value="张阿姨|3166">张阿姨 · 尾号 3166</option><option value="王师傅|9021">王师傅 · 尾号 9021</option></select></label>' +
      '<label class="field">转出账户<select id="editAccount"><option>主账户（尾号 1234）</option><option>工资卡（尾号 5208）</option></select></label>' +
      '<label class="field">金额（元）<input id="editAmount" type="number" inputmode="decimal" min="0.01" step="0.01" value="' + money() + '"></label></div>' +
      '<div class="code-err" id="editErr"></div>' +
      '<div class="cc-btns"><button class="btn primary" onclick="applyEdit(this)">保存并重新确认</button><button class="btn ghost" onclick="cancelEdit(this)">返回候选</button></div>';
    chat.appendChild(wrap); scrollBottom(); busy = false;
    wrap.querySelector('#editPayee').value = transfer.payee + '|' + transfer.tail;
    wrap.querySelector('#editAccount').value = transfer.account;
  }

  function applyEdit(btn){
    var wrap = btn.closest('.confirm-card');
    var payee = wrap.querySelector('#editPayee').value.split('|');
    var amount = Number(wrap.querySelector('#editAmount').value);
    if(!amount || amount <= 0){ wrap.querySelector('#editErr').textContent = '请输入大于 0 的金额'; return; }
    transfer.payee = payee[0]; transfer.tail = payee[1];
    transfer.account = wrap.querySelector('#editAccount').value;
    transfer.amount = amount.toFixed(2);
    disableCard(wrap, '修改内容已保存');
    addAssistant('已按您的修改更新，请重新确认。'); addConfirmCard();
  }

  function cancelEdit(btn){
    btn.closest('.confirm-card').remove();
    var cards = chat.querySelectorAll('.cards');
    var last = cards[cards.length - 1];
    if(last){
      var options = last.querySelectorAll('button');
      for(var i=0;i<options.length;i++) options[i].disabled = false;
    }else{
      addAssistant('已返回恢复后的确认单。'); addConfirmCard();
    }
  }

  /* 确认单 */
  function addConfirmCard(){
    var wrap = document.createElement('div');
    wrap.className = 'confirm-card';
    wrap.innerHTML =
      '<div class="cc-title">请确认这笔转账</div>' +
      '<div class="cc-row"><span>收款人</span><b>' + esc(transfer.payee) + '（尾号 ' + esc(transfer.tail) + '）</b></div>' +
      '<div class="cc-row"><span>转出账户</span><b>' + esc(transfer.account) + '</b></div>' +
      '<div class="cc-row amount"><span>金额</span><b>¥' + money() + '</b></div>' +
      '<div class="cc-row"><span>到账</span><b>实时到账</b></div>' +
      '<div class="cc-btns">' +
        '<button class="btn primary" onclick="goVerify(this)">确认办理</button>' +
        '<button class="btn ghost" onclick="editFromConfirm(this)">返回修改</button>' +
        '<button class="btn ghost" onclick="cancelFlow(this)">取消</button>' +
      '</div>';
    chat.appendChild(wrap); scrollBottom();
    saveStage('confirmation');
  }

  function editFromConfirm(btn){
    disableCard(btn.closest('.confirm-card'), '本次确认已撤回，请修改后重新确认');
    showEdit(btn);
  }

  function goVerify(btn){
    if(busy) return; busy = true;
    disableCard(btn.closest('.confirm-card'));
    recordHistory('已确认：' + transfer.payee + '（尾号 ' + transfer.tail + '） · ¥' + money());
    saveStage('verification');
    addCodeCard();
    busy = false;
  }

  function cancelFlow(btn){
    disableCard(btn.closest('.confirm-card'), '本次转账已取消，旧按钮不可再用');
    resetTaskData();
    addAssistant('好的，这笔转账已取消。');
  }

  function addFaceChallenge(){
    saveStage('face');
    var wrap = document.createElement('div'); wrap.className = 'code-card';
    var controls = isAdminMode ?
      '<div class="admin-zone"><div class="admin-zone-title">管理员演示控制页</div><button class="btn primary" onclick="submitAdminFace(this)">提交模拟成功</button><button class="btn ghost" onclick="adminFaceFailed(this)">提交模拟失败</button></div>' :
      '<div class="safe-note">请由管理员在独立演示控制页作答。当前用户页没有制造通过或失败的按钮；管理员提交后请刷新本页读取结果。</div>';
    wrap.innerHTML = '<div class="cc-title">等待模拟人脸验证</div><div class="face-mark">☺</div>' +
      '<div class="safe-note">不会开启摄像头或采集生物信息。</div>' + controls;
    chat.appendChild(wrap); scrollBottom();
  }

  function submitAdminFace(btn){
    if(!isAdminMode) return;
    disableCard(btn.closest('.code-card'), '管理员决定已提交，等待用户端读取');
    recordHistory('安全验证：验证码通过；管理员模拟人脸通过');
    saveStage('face_passed');
    addAssistant('模拟成功已提交。用户端刷新后会读取验证结果，不会由本页直接执行转账。');
  }
  function adminFaceFailed(btn){
    if(!isAdminMode) return;
    var wrap = btn.closest('.code-card'); disableCard(wrap, '管理员决定已提交，等待用户端读取');
    recordHistory('安全验证终止：模拟人脸未通过'); saveStage('face_failed');
    addAssistant('模拟失败已提交。用户端刷新后会显示任务终止。');
  }
  function addFaceResult(passed){
    var wrap = document.createElement('div'); wrap.className = 'code-card';
    if(passed){
      wrap.innerHTML = '<div class="cc-title">模拟人脸验证已通过</div><div class="safe-note">这是从管理员演示控制页读取的结果。</div><button class="btn primary" onclick="continueAfterFace(this)">继续办理</button>';
    }else{
      wrap.innerHTML = '<div class="cc-title">模拟人脸验证未通过</div><div class="safe-note">本次任务已终止，没有发起转账。</div>';
    }
    chat.appendChild(wrap); scrollBottom();
  }
  function continueAfterFace(btn){
    var saved = loadSavedState();
    if(!saved || saved.stage !== 'face_passed') return;
    disableCard(btn.closest('.code-card'), '验证结果已读取'); runTransfer();
  }

  /* 验证码 */
  function addCodeCard(){
    var wrap = document.createElement('div');
    wrap.className = 'code-card';
    var boxes = '';
    for(var i=0;i<6;i++) boxes += '<input class="cb" maxlength="1" inputmode="numeric">';
    wrap.innerHTML =
      '<div class="cc-title">为了安全，请输入验证码</div>' +
      '<div class="code-demo">模拟验证码：<b>123456</b></div>' +
      '<div class="code-boxes">' + boxes + '</div>' +
      '<div class="code-err" id="codeErr"></div>' +
      '<button class="btn primary" onclick="submitCode(this)">提交验证码</button>';
    chat.appendChild(wrap); scrollBottom();
    var cb = wrap.querySelectorAll('.cb');
    for(var i=0;i<cb.length;i++){
      (function(i){
        cb[i].addEventListener('input', function(){
          if(this.value){ if(i<5) cb[i+1].focus(); }
        });
        cb[i].addEventListener('keydown', function(e){
          if(e.key==='Backspace' && !this.value && i>0) cb[i-1].focus();
        });
      })(i);
    }
    cb[0].focus();
  }

  async function submitCode(btn){
    if(busy) return; busy = true;
    var wrap = btn.closest('.code-card');
    var cb = wrap.querySelectorAll('.cb');
    var code = '';
    for(var i=0;i<cb.length;i++) code += cb[i].value;
    if(code !== '123456'){
      var err = wrap.querySelector('#codeErr');
      err.textContent = '验证码不对，请再输一次';
      for(var i=0;i<cb.length;i++) cb[i].value = '';
      cb[0].focus();
      busy = false; return;
    }
    disableCard(wrap, '验证码已验证');
    recordHistory('安全验证：验证码已通过，等待管理员模拟人脸');
    busy = false; addFaceChallenge();
  }

  async function runTransfer(){
    if(busy) return; busy = true; saveStage('processing');
    var wait = document.createElement('div'); wait.className = 'confirm-card';
    wait.innerHTML = '<div class="prog"><span class="spinner"></span><span><b>正在办理，请不要重复操作</b><br>正在安全提交这笔转账…</span></div>';
    chat.appendChild(wait); scrollBottom();
    await sleep(1600);
    wait.innerHTML = '<div class="prog"><span class="spinner"></span><span><b>银行正在处理</b><br>请稍等，完成后会显示结果。</span></div>';
    await sleep(1400);
    disableCard(wait, '处理已结束'); addResult(); busy = false;
  }

  /* 结果卡 */
  function addResult(){
    var wrap = document.createElement('div');
    wrap.className = 'result-card';
    wrap.innerHTML =
      '<div class="rc-status success"><span class="ico">✓</span>转账成功</div>' +
      '<div class="rc-amount">¥' + money() + '</div>' +
      '<div class="rc-line">已转给 <b>' + esc(transfer.payee) + '</b>（尾号 ' + esc(transfer.tail) + '）</div>' +
      '<div class="rc-line">转出账户：' + esc(transfer.account) + '</div>' +
      '<div class="rc-line">交易号：DEMO-20261012-001</div>' +
      '<div class="rc-note">原型演示结果，不代表真实银行交易。</div>';
    chat.appendChild(wrap); scrollBottom();
    saveStage('result');
    setTimeout(function(){ addAssistant('还有什么要我帮忙的吗？'); }, 600);
  }

  /* 主流程 */
  async function runFlow(text){
    if(busy) return; busy = true;
    addUser(text);
    input.value = ''; updateSend();
    await sleep(500);
    var t = typing();
    await sleep(1000);
    t.remove();
    addAssistant('好的，我帮您办一笔转账。');
    await sleep(400);
    addCards();
    busy = false;
  }

  function updateSend(){
    sendBtn.disabled = input.value.trim().length === 0;
  }

  function send(){
    var v = input.value.trim();
    if(!v || busy) return;
    runFlow(v);
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('input', updateSend);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') send(); });
  updateSend();

  /* 话筒：长按说话，松开转写 */
  function micDown(e){ e.preventDefault(); mic.classList.add('recording'); rec.classList.add('show'); }
  function micUp(e){
    if(e.cancelable) e.preventDefault();
    mic.classList.remove('recording'); rec.classList.remove('show');
    input.value = '转给妈妈500块'; updateSend(); input.focus();
  }
  mic.addEventListener('mousedown', micDown);
  mic.addEventListener('mouseup', micUp);
  mic.addEventListener('mouseleave', function(){ mic.classList.remove('recording'); rec.classList.remove('show'); });
  mic.addEventListener('touchstart', micDown, {passive:false});
  mic.addEventListener('touchend', micUp, {passive:false});

  /* 重来 */
  function resetDemo(){
    busy = false; resetTaskData();
    chat.innerHTML = '';
    input.value = ''; updateSend();
    addAssistant('您好，我是您的银行小助手。您想办点什么？');
  }

  /* 初始 */
  function boot(){
    chat.innerHTML = '';
    if(isAdminMode){
      document.querySelector('.topbar .title').textContent = '管理员演示控制页';
      document.querySelector('.topbar .reset').style.display = 'none';
      document.querySelector('.inputbar').style.display = 'none';
      addAssistant('这里仅用于管理员提交模拟人脸结果，不会直接执行转账。');
    }else addAssistant('您好，我是您的银行小助手。您想办点什么？');
    var saved = loadSavedState();
    if(!saved || !saved.stage) return;
    transfer = saved.transfer; taskHistory = saved.history;
    if(isAdminMode){
      if(saved.stage === 'face') addFaceChallenge();
      else addAssistant('当前没有等待管理员作答的人脸验证。');
      return;
    }
    addAssistant('检测到页面刷新前有一笔未清理的转账任务。为避免重复操作，我不会自动继续。');
    var wrap = document.createElement('div'); wrap.className = 'recovery-card';
    wrap.innerHTML = '<div class="cc-title">继续查看原任务</div><p>' + esc(transfer.payee) + '（尾号 ' + esc(transfer.tail) + '） · ¥' + money() + '<br>刷新前状态：' + stageLabel(saved.stage) + '</p>' +
      '<button class="btn primary" id="resumeTask">查看并继续</button><button class="btn ghost" onclick="discardTask(this)">放弃这次任务</button>';
    chat.appendChild(wrap); scrollBottom();
    wrap.querySelector('#resumeTask').addEventListener('click', function(){ resumeTask(this, saved.stage); });
  }

  function stageLabel(stage){ return {confirmation:'等待确认',verification:'等待验证码',face:'等待管理员模拟人脸',face_passed:'模拟人脸已通过',face_failed:'模拟人脸未通过',processing:'处理中，需查询结果',result:'已显示结果'}[stage] || '待查看'; }
  function addRecoveredHistory(){
    if(!taskHistory.length) return;
    var wrap = document.createElement('div'); wrap.className = 'confirm-card history-card';
    var rows = '';
    for(var i=0;i<taskHistory.length;i++) rows += '<div>' + esc(taskHistory[i]) + '</div>';
    wrap.innerHTML = '<div class="cc-title">已恢复的任务记录</div><div class="history-list">' + rows + '</div>';
    chat.appendChild(wrap); scrollBottom();
  }
  function resumeTask(btn, stage){
    disableCard(btn.closest('.recovery-card'), '已恢复原任务，不会创建新任务');
    addRecoveredHistory();
    if(stage === 'confirmation') addConfirmCard();
    else if(stage === 'verification') addCodeCard();
    else if(stage === 'face') addFaceChallenge();
    else if(stage === 'face_passed') addFaceResult(true);
    else if(stage === 'face_failed') addFaceResult(false);
    else if(stage === 'processing'){
      addAssistant('刷新发生在处理中。原型仅演示只读查询，不会再次提交。');
      var w = document.createElement('div'); w.className = 'result-card';
      w.innerHTML = '<div class="rc-status" style="background:#FFF4E5;color:var(--warning)">结果待核实</div><div class="rc-note">请在正式前端通过“查询原操作”获取后端结果。</div>';
      chat.appendChild(w); scrollBottom();
    } else addResult();
  }
  function discardTask(btn){ resetTaskData(); disableCard(btn.closest('.recovery-card'), '本地原型任务已放弃'); addAssistant('已放弃这次原型任务，没有发起新的转账。'); }

  boot();
</script>
</body>
</html>
